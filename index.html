<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Snake</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1a; font-family: system-ui, sans-serif; color: #e8f0ff; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 18px; letter-spacing: .05em; text-shadow: 0 0 8px #000; }
  #hud span { color: #7dffb2; font-weight: 700; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; background: rgba(5,8,16,.6); font-size: 20px; cursor: pointer; }
  #msg h1 { font-size: 48px; margin: 0 0 8px; color: #7dffb2; }
  #msg p { margin: 4px 0; opacity: .85; }
  .hidden { display: none !important; }
  #pad { position: fixed; bottom: 16px; right: 16px; display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; }
  #pad button { height: 56px; font-size: 22px; border-radius: 12px; border: 1px solid #345; background: rgba(30,50,80,.6); color: #fff; touch-action: manipulation; }
  @media (hover: hover) { #pad { display: none; } }
</style>
</head>
<body>
<div id="hud">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div>
<div id="msg">
  <h1 id="title">3D SNAKE</h1>
  <p id="sub">Arrow keys / WASD to steer &middot; Space to pause &middot; Drag to orbit</p>
  <p>Click or press Space to start</p>
</div>
<div id="pad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const N = 20;                 // grid is N x N
  const STEP_MS_START = 150;    // tick speed, decreases as you eat
  const STEP_MS_MIN = 70;

  // ---------- scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f1a);
  scene.fog = new THREE.Fog(0x0b0f1a, 30, 70);

  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x1a2030, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(10, 25, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
  scene.add(sun);

  // board: grid cell (x,z) in [0,N) maps to world centered at origin
  const toWorld = (v) => v - N / 2 + 0.5;

  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 512;
  const fc = floorCanvas.getContext('2d');
  const cs = 512 / N;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    fc.fillStyle = (i + j) % 2 ? '#16203a' : '#1a2646';
    fc.fillRect(i * cs, j * cs, cs, cs);
  }
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(N, N),
    new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(floorCanvas), roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // walls
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4a7a, emissive: 0x111a33, roughness: 0.6 });
  [[0, -N / 2 - 0.25, N + 1, 0.5], [0, N / 2 + 0.25, N + 1, 0.5]].forEach(([x, z, w, d]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), wallMat); m.position.set(x, 0.4, z); m.castShadow = true; scene.add(m);
  });
  [[-N / 2 - 0.25], [N / 2 + 0.25]].forEach(([x]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, N), wallMat); m.position.set(x, 0.4, 0); m.castShadow = true; scene.add(m);
  });

  // ---------- game objects ----------
  const segGeo = new THREE.BoxGeometry(0.88, 0.88, 0.88);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.4 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0x7dffb2, emissive: 0x1a7a44, roughness: 0.3 });

  const food = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 24, 24),
    new THREE.MeshStandardMaterial({ color: 0xff4d6d, emissive: 0xaa1133, roughness: 0.2 })
  );
  food.castShadow = true;
  const foodLight = new THREE.PointLight(0xff4d6d, 1.2, 6);
  food.add(foodLight);
  scene.add(food);

  // eyes on the head
  const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

  const head = new THREE.Group();
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat), eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  head.add(eyeL, eyeR);
  scene.add(head);

  // ---------- state ----------
  let snake, meshes, dir, nextDir, foodPos, score, alive, running, accum, stepMs, best;
  try { best = +localStorage.getItem('snake3d-best') || 0; } catch (e) { best = 0; }
  const $ = (id) => document.getElementById(id);
  $('best').textContent = best;

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  function reset() {
    (meshes || []).forEach((m) => scene.remove(m));
    meshes = [];
    const c = N >> 1;
    snake = [{ x: c, z: c }, { x: c - 1, z: c }, { x: c - 2, z: c }];
    dir = nextDir = DIRS.right;
    score = 0; alive = true; accum = 0; stepMs = STEP_MS_START;
    $('score').textContent = 0;
    snake.forEach(addMesh);
    placeFood();
    syncMeshes(1);
  }

  function addMesh() {
    const m = new THREE.Mesh(segGeo, bodyMat);
    m.castShadow = true;
    scene.add(m);
    meshes.push(m);
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let z = 0; z < N; z++)
      if (!snake.some((s) => s.x === x && s.z === z)) free.push({ x, z });
    if (!free.length) { end(true); return; }
    foodPos = free[(Math.random() * free.length) | 0];
    food.position.set(toWorld(foodPos.x), 0.45, toWorld(foodPos.z));
  }

  // previous positions for smooth interpolation between ticks
  let prev = [];
  function syncMeshes(t) {
    while (meshes.length < snake.length) addMesh();
    snake.forEach((s, i) => {
      const p = prev[i] || s;
      const x = p.x + (s.x - p.x) * t, z = p.z + (s.z - p.z) * t;
      const m = meshes[i];
      m.position.set(toWorld(x), 0.45, toWorld(z));
      m.material = i === 0 ? headMat : bodyMat;
      const k = i === 0 ? 1 : Math.max(0.65, 1 - i * 0.012);
      m.scale.setScalar(k);
    });
    head.visible = alive;
  }

  function updateHead() {
    const h = meshes[0].position;
    head.position.copy(h);
    head.position.y = 0.6;
    // eyes sit on the leading face, offset sideways
    const [dx, dz] = dir;
    eyeL.position.set(dx * 0.4 - dz * 0.22, 0, dz * 0.4 + dx * 0.22);
    eyeR.position.set(dx * 0.4 + dz * 0.22, 0, dz * 0.4 - dx * 0.22);
  }

  function tick() {
    dir = nextDir;
    prev = snake.map((s) => ({ x: s.x, z: s.z }));
    const h = { x: snake[0].x + dir[0], z: snake[0].z + dir[1] };
    const eating = h.x === foodPos.x && h.z === foodPos.z;

    // tail moves away unless eating, so it's not a collision
    const body = eating ? snake : snake.slice(0, -1);
    if (h.x < 0 || h.z < 0 || h.x >= N || h.z >= N || body.some((s) => s.x === h.x && s.z === h.z)) {
      end(false);
      return;
    }
    snake.unshift(h);
    if (eating) {
      prev.push({ ...prev[prev.length - 1] }); // new tail grows out of old tail
      score++;
      $('score').textContent = score;
      stepMs = Math.max(STEP_MS_MIN, STEP_MS_START - score * 4);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function end(won) {
    alive = false; running = false;
    if (score > best) {
      best = score; $('best').textContent = best;
      try { localStorage.setItem('snake3d-best', best); } catch (e) {}
    }
    $('title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
    $('sub').textContent = 'Score: ' + score;
    $('msg').classList.remove('hidden');
    meshes.forEach((m) => (m.material = new THREE.MeshStandardMaterial({ color: 0x884455 })));
  }

  // ---------- input ----------
  function steer(name) {
    const d = DIRS[name];
    if (!running) return;
    if (d[0] === -dir[0] && d[1] === -dir[1]) return; // no reversing
    nextDir = d;
  }
  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  addEventListener('keydown', (e) => {
    if (KEYS[e.code]) { e.preventDefault(); steer(KEYS[e.code]); }
    else if (e.code === 'Space') { e.preventDefault(); toggle(); }
  });
  document.querySelectorAll('#pad button').forEach((b) => b.addEventListener('click', () => steer(b.dataset.d)));
  $('msg').addEventListener('click', () => { if (!running) toggle(); });

  function toggle() {
    if (running) {
      running = false;
      $('title').textContent = 'PAUSED';
      $('sub').textContent = 'Press Space to resume';
      $('msg').classList.remove('hidden');
    } else {
      if (!alive) { reset(); }
      running = true;
      $('msg').classList.add('hidden');
    }
  }

  // ---------- camera orbit (drag) ----------
  let yaw = 0, pitch = 0.95, dist = 26, dragging = false, lx = 0, ly = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', () => (dragging = false));
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    yaw -= (e.clientX - lx) * 0.005;
    pitch = Math.min(1.45, Math.max(0.35, pitch + (e.clientY - ly) * 0.005));
    lx = e.clientX; ly = e.clientY;
  });
  cv.addEventListener('wheel', (e) => { dist = Math.min(40, Math.max(14, dist + e.deltaY * 0.02)); }, { passive: true });

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- loop ----------
  reset();
  alive = false; // show title screen until first start; toggle() will reset
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (running) {
      accum += dt;
      while (accum >= stepMs && running) { accum -= stepMs; tick(); }
    }
    syncMeshes(running ? Math.min(1, accum / stepMs) : 1);
    if (meshes.length) updateHead();

    food.position.y = 0.55 + Math.sin(now / 250) * 0.12;
    food.rotation.y = now / 600;

    // gentle camera follow of the head
    const target = meshes[0].position;
    const cx = Math.cos(pitch) * Math.sin(yaw) * dist, cz = Math.cos(pitch) * Math.cos(yaw) * dist, cy = Math.sin(pitch) * dist;
    camera.position.set(target.x * 0.25 + cx, cy, target.z * 0.25 + cz);
    camera.lookAt(target.x * 0.25, 0, target.z * 0.25);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
