<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buckshot Roulette</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e9e3d6; font-family: "Courier New", monospace; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 14px; left: 18px; font-size: 15px; line-height: 1.6; text-shadow: 0 0 6px #000; }
  #slots { display: flex; gap: 6px; margin: 4px 0; }
  .slot { width: 18px; height: 34px; border-radius: 4px; border: 2px solid #c9a24a; background: #c9a24a; transition: all .3s; }
  .slot.spent { background: transparent; border-color: #555; }
  #msg { position: fixed; left: 0; right: 0; bottom: 110px; text-align: center; font-size: 22px; text-shadow: 0 0 8px #000; min-height: 30px; padding: 0 12px; }
  #actions { position: fixed; left: 0; right: 0; bottom: 30px; display: flex; gap: 16px; justify-content: center; }
  button { font: inherit; font-size: 18px; padding: 12px 22px; background: #1a1612; color: #e9e3d6; border: 2px solid #c9a24a; cursor: pointer; letter-spacing: .08em; }
  button:hover { background: #c9a24a; color: #111; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #over { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.82); text-align: center; }
  #over h1 { font-size: 56px; margin: 0 0 8px; letter-spacing: .1em; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; padding: 20px; }
  #start h1 { font-size: 46px; margin: 0 0 12px; color: #c9a24a; letter-spacing: .12em; }
  #start p { max-width: 520px; opacity: .85; line-height: 1.5; margin: 6px 0; }
</style>
</head>
<body>
<div id="hud">
  <div>SHELLS LEFT</div>
  <div id="slots"></div>
  <div id="odds"></div>
  <div id="score"></div>
</div>
<div id="msg"></div>
<div id="actions">
  <button id="bDealer">[1] SHOOT DEALER</button>
  <button id="bSelf">[2] SHOOT YOURSELF</button>
</div>
<div id="flash"></div>
<div id="over"><h1 id="overT"></h1><p id="overS"></p><button id="again">PLAY AGAIN</button></div>
<div id="start">
  <h1>BUCKSHOT ROULETTE</h1>
  <p>One live shell is hidden among six in the shotgun. You and the Dealer take turns.</p>
  <p>Shoot the Dealer, or shoot yourself. A blank fired at yourself lets you go again. A blank fired at the other player passes the turn.</p>
  <p>Whoever takes the live shell loses.</p>
  <button id="go" style="margin-top:18px">SIT DOWN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const SHELLS = 6;
  const $ = (id) => document.getElementById(id);

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.FogExp2(0x050505, 0.18);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 50);
  const CAM = new THREE.Vector3(0, 1.45, 1.55);
  camera.position.copy(CAM);

  scene.add(new THREE.AmbientLight(0x30343a, 0.55));
  const lampLight = new THREE.SpotLight(0xffd9a0, 2.2, 12, 0.7, 0.55, 1.2);
  lampLight.position.set(0, 3.2, 0);
  lampLight.target.position.set(0, 0.9, 0);
  lampLight.castShadow = true;
  lampLight.shadow.mapSize.set(2048, 2048);
  lampLight.shadow.bias = -0.0005;
  scene.add(lampLight, lampLight.target);
  const muzzleLight = new THREE.PointLight(0xffc070, 0, 8);
  scene.add(muzzleLight);

  const std = (color, rough = 0.8, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
  function mesh(geo, mat, x, y, z, parent = scene) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
  }

  // room
  const floor = mesh(new THREE.PlaneGeometry(14, 14), std(0x151311, 0.9), 0, 0, 0);
  floor.rotation.x = -Math.PI / 2; floor.castShadow = false;
  const wallMat = std(0x1a1d1a, 1);
  [[0, 3, -5, 0], [0, 3, 5, Math.PI], [-5, 3, 0, Math.PI / 2], [5, 3, 0, -Math.PI / 2]].forEach(([x, y, z, ry]) => {
    const w = mesh(new THREE.PlaneGeometry(10, 6), wallMat, x, y, z); w.rotation.y = ry; w.castShadow = false;
  });

  // lamp fixture
  mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 8), std(0x222222), 0, 3.7, 0);
  mesh(new THREE.ConeGeometry(0.35, 0.3, 24, 1, true), std(0x2a2a2a, 0.5, 0.6, { side: THREE.DoubleSide }), 0, 3.25, 0).castShadow = false;
  mesh(new THREE.SphereGeometry(0.08, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe2b0 }), 0, 3.15, 0).castShadow = false;

  // table
  const wood = std(0x3a2616, 0.55);
  mesh(new THREE.BoxGeometry(2.4, 0.08, 1.2), wood, 0, 0.9, 0);
  [[-1.1, -0.5], [1.1, -0.5], [-1.1, 0.5], [1.1, 0.5]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(0.1, 0.86, 0.1), wood, x, 0.43, z));

  // player's chair (just a hint of it behind the camera) and the dealer's chair
  const chairMat = std(0x2b1d12, 0.6);
  const dealerChair = new THREE.Group(); dealerChair.position.set(0, 0, -1.55); scene.add(dealerChair);
  mesh(new THREE.BoxGeometry(0.55, 0.06, 0.55), chairMat, 0, 0.5, 0, dealerChair);
  [[-0.24, -0.24], [0.24, -0.24], [-0.24, 0.24], [0.24, 0.24]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(0.05, 0.5, 0.05), chairMat, x, 0.25, z, dealerChair));
  mesh(new THREE.BoxGeometry(0.55, 0.9, 0.05), chairMat, 0, 0.98, -0.27, dealerChair);

  // ---------- dealer ----------
  const dealer = new THREE.Group(); dealer.position.set(0, 0.53, -1.5); scene.add(dealer);
  const suit = std(0x101012, 0.7), skin = std(0xcfc7b8, 0.6);
  const torso = mesh(new THREE.BoxGeometry(0.62, 0.74, 0.34), suit, 0, 0.62, 0, dealer);
  mesh(new THREE.BoxGeometry(0.2, 0.46, 0.02), std(0xd8d4c8, 0.7), 0, 0.68, 0.18, dealer);          // shirt
  mesh(new THREE.BoxGeometry(0.06, 0.34, 0.02), std(0x7a1010, 0.6), 0, 0.64, 0.195, dealer);        // tie
  const headG = new THREE.Group(); headG.position.set(0, 1.18, 0); dealer.add(headG);
  mesh(new THREE.SphereGeometry(0.19, 28, 22), skin, 0, 0, 0, headG).scale.set(0.95, 1.1, 0.95);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3a2a });
  [-0.065, 0.065].forEach((x) => mesh(new THREE.SphereGeometry(0.03, 10, 10), eyeMat, x, 0.04, 0.17, headG).castShadow = false);
  mesh(new THREE.BoxGeometry(0.17, 0.012, 0.01), std(0x111111), 0, -0.09, 0.18, headG);              // mouth line
  mesh(new THREE.BoxGeometry(0.34, 0.03, 0.34), suit, 0, 0.17, 0, headG);                            // hat brim
  mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.14, 24), suit, 0, 0.25, 0, headG);                   // hat crown
  const armL = mesh(new THREE.BoxGeometry(0.12, 0.12, 0.62), suit, -0.34, 0.45, 0.3, dealer);
  const armR = mesh(new THREE.BoxGeometry(0.12, 0.12, 0.62), suit, 0.34, 0.45, 0.3, dealer);
  [-0.34, 0.34].forEach((x) => mesh(new THREE.SphereGeometry(0.065, 12, 12), skin, x, 0.45, 0.62, dealer));
  // lower body
  mesh(new THREE.BoxGeometry(0.56, 0.18, 0.5), suit, 0, 0.14, 0.12, dealer);

  // ---------- shotgun (barrel along local +z) ----------
  const gun = new THREE.Group(); scene.add(gun);
  const steel = std(0x2b2d31, 0.35, 0.85), gunWood = std(0x4a2d18, 0.5);
  const barrel = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.95, 16), steel, 0, 0, 0.45, gun); barrel.rotation.x = Math.PI / 2;
  mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.78, 12), steel, 0, -0.045, 0.34, gun).rotation.x = Math.PI / 2;  // magazine tube
  mesh(new THREE.BoxGeometry(0.07, 0.07, 0.3), gunWood, 0, -0.045, 0.3, gun);                                      // pump
  mesh(new THREE.BoxGeometry(0.06, 0.09, 0.26), steel, 0, -0.01, -0.06, gun);                                      // receiver
  mesh(new THREE.BoxGeometry(0.06, 0.1, 0.4), gunWood, 0, -0.04, -0.4, gun).rotation.x = -0.12;                    // stock
  mesh(new THREE.BoxGeometry(0.012, 0.02, 0.02), std(0xc9a24a, 0.3, 0.9), 0, 0.03, 0.9, gun);                      // bead sight
  const muzzle = new THREE.Object3D(); muzzle.position.set(0, 0, 0.95); gun.add(muzzle);

  const POSES = {
    rest:         { x: 0.05, y: 0.96, z: 0.05, ry: Math.PI / 2 + 0.2, rx: 0 },
    playerAtDealer:{ x: 0.12, y: 1.18, z: 0.85, ry: Math.PI, rx: 0.02 },
    playerAtSelf: { x: 0.02, y: 1.28, z: 0.55, ry: 0, rx: 0.0 },
    dealerAtPlayer:{ x: 0.0, y: 1.2, z: -0.75, ry: 0, rx: -0.02 },
    dealerAtSelf: { x: 0.0, y: 1.2, z: -0.95, ry: Math.PI, rx: 0.0 },
  };
  const setPose = (p) => { gun.position.set(p.x, p.y, p.z); gun.rotation.set(p.rx, p.ry, 0); };
  setPose(POSES.rest);

  // ---------- tiny tween engine ----------
  const tweens = [];
  function tween(dur, fn) {
    return new Promise((res) => tweens.push({ t: 0, dur, fn, res }));
  }
  const ease = (k) => k * k * (3 - 2 * k);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function moveGun(pose, dur = 0.55) {
    const from = { x: gun.position.x, y: gun.position.y, z: gun.position.z, ry: gun.rotation.y, rx: gun.rotation.x };
    let ry = pose.ry; while (ry - from.ry > Math.PI) ry -= 2 * Math.PI; while (ry - from.ry < -Math.PI) ry += 2 * Math.PI;
    return tween(dur, (k) => {
      const e = ease(k);
      gun.position.set(from.x + (pose.x - from.x) * e, from.y + (pose.y - from.y) * e, from.z + (pose.z - from.z) * e);
      gun.rotation.set(from.rx + (pose.rx - from.rx) * e, from.ry + (ry - from.ry) * e, 0);
    });
  }

  // ---------- audio ----------
  let ac;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
  function noise(dur, vol, lp) {
    const a = audio(); if (!a) return;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  function tone(freq, dur, vol, type = 'square') {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  const sfx = {
    bang() { noise(0.9, 1.0, 3500); tone(70, 0.4, 0.5, 'sawtooth'); },
    click() { tone(1800, 0.04, 0.2); setTimeout(() => tone(900, 0.05, 0.15), 60); },
    rack() { noise(0.12, 0.3, 6000); setTimeout(() => noise(0.12, 0.3, 5000), 180); },
  };

  // ---------- game state ----------
  let chamber, pos, turn, busy, wins = { you: 0, dealer: 0 }, gameOver;
  const remaining = () => SHELLS - pos;

  function say(t) { $('msg').textContent = t; }
  function renderHud() {
    $('slots').innerHTML = '';
    for (let i = 0; i < SHELLS; i++) {
      const s = document.createElement('div'); s.className = 'slot' + (i < pos ? ' spent' : ''); $('slots').appendChild(s);
    }
    $('odds').textContent = gameOver ? '' : `Next shell is live: 1 in ${remaining()}`;
    $('score').textContent = `You ${wins.you} - ${wins.dealer} Dealer`;
  }
  function showActions(on) { $('actions').style.display = on ? 'flex' : 'none'; }

  function newGame() {
    chamber = Array(SHELLS).fill(false);
    chamber[(Math.random() * SHELLS) | 0] = true;   // exactly one live shell, position unknown
    pos = 0; gameOver = false; busy = false;
    turn = Math.random() < 0.5 ? 'you' : 'dealer';
    $('over').style.display = 'none';
    // reset dealer pose and camera
    dealer.rotation.x = 0; dealer.position.y = 0.53; dealer.position.z = -1.5;
    headG.rotation.set(0, 0, 0);
    camera.position.copy(CAM); camCrash = 0;
    setPose(POSES.rest);
    sfx.rack();
    renderHud();
    say(turn === 'you' ? 'You go first.' : 'The Dealer goes first.');
    wait(900).then(nextTurn);
  }

  function nextTurn() {
    if (gameOver) return;
    renderHud();
    if (turn === 'you') {
      busy = false; showActions(true);
      say(remaining() === 1 ? 'Last shell. You know what it is.' : 'Your turn. Shoot who?');
    } else {
      showActions(false); busy = true;
      say('The Dealer reaches for the shotgun...');
      wait(1200).then(dealerMove);
    }
  }

  function dealerMove() {
    const r = remaining(), pLive = 1 / r;
    // last shell is known to be live; otherwise gamble on himself only when the odds are low
    const shootSelf = pLive < 0.34 && Math.random() < 0.85;
    fire('dealer', shootSelf ? 'dealer' : 'you');
  }

  function playerChoice(target) {
    if (busy || gameOver || turn !== 'you') return;
    audio(); if (ac && ac.state === 'suspended') ac.resume();
    busy = true; showActions(false);
    fire('you', target === 'self' ? 'you' : 'dealer');
  }

  async function fire(shooter, target) {
    const self = shooter === target;
    const pose = shooter === 'you' ? (self ? POSES.playerAtSelf : POSES.playerAtDealer) : (self ? POSES.dealerAtSelf : POSES.dealerAtPlayer);
    say(shooter === 'you' ? (self ? 'You raise the barrel to yourself...' : 'You aim at the Dealer...') : (self ? 'The Dealer points it at himself...' : 'The Dealer aims at you...'));
    sfx.rack();
    await moveGun(pose, 0.8);
    await wait(900 + Math.random() * 700);   // tension

    const live = chamber[pos++];
    renderHud();
    if (live) {
      sfx.bang(); flash(); camShake(0.12); muzzleFlash();
      const loser = target;
      await wait(250);
      if (loser === 'dealer') await dealerDies(); else await youDie();
      endGame(loser === 'dealer' ? 'you' : 'dealer');
      return;
    }
    sfx.click();
    say('*click* ... blank.');
    await wait(900);
    await moveGun(POSES.rest, 0.6);
    // blank at yourself = go again; blank at the other player = turn passes
    if (!self) turn = shooter === 'you' ? 'dealer' : 'you';
    else say(shooter === 'you' ? 'Blank. You keep the turn.' : 'Blank. The Dealer keeps the turn.');
    await wait(700);
    nextTurn();
  }

  async function dealerDies() {
    const startRot = dealer.rotation.x, startY = dealer.position.y;
    await tween(0.7, (k) => {
      const e = k * k;
      dealer.rotation.x = startRot - e * 1.35;
      dealer.position.y = startY - e * 0.2;
      headG.rotation.x = -e * 0.5;
    });
    say('The Dealer slumps over the table.');
    await wait(900);
  }
  let camCrash = 0;
  async function youDie() {
    document.body.style.background = '#000';
    await tween(0.9, (k) => { camCrash = k; });
    say('');
  }

  function endGame(winner) {
    gameOver = true; showActions(false);
    wins[winner]++;
    renderHud();
    $('overT').textContent = winner === 'you' ? 'YOU SURVIVED' : 'YOU DIED';
    $('overT').style.color = winner === 'you' ? '#7dffb2' : '#d64545';
    $('overS').textContent = winner === 'you' ? 'The Dealer took the live shell.' : 'You took the live shell.';
    setTimeout(() => ($('over').style.display = 'flex'), 400);
  }

  // ---------- effects ----------
  let shake = 0;
  function camShake(a) { shake = a; }
  function flash() {
    const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 0.9;
    requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = 0; });
  }
  function muzzleFlash() {
    const p = new THREE.Vector3(); muzzle.getWorldPosition(p);
    muzzleLight.position.copy(p); muzzleLight.intensity = 6;
    setTimeout(() => (muzzleLight.intensity = 0), 90);
  }

  // ---------- input ----------
  $('bDealer').onclick = () => playerChoice('dealer');
  $('bSelf').onclick = () => playerChoice('self');
  addEventListener('keydown', (e) => {
    if (e.code === 'Digit1' || e.code === 'Numpad1') playerChoice('dealer');
    if (e.code === 'Digit2' || e.code === 'Numpad2') playerChoice('self');
    if ((e.code === 'Space' || e.code === 'KeyR') && gameOver && $('over').style.display === 'flex') newGame();
  });
  $('again').onclick = newGame;
  $('go').onclick = () => { audio(); $('start').style.display = 'none'; newGame(); };

  // small head-look with the mouse
  let lookX = 0, lookY = 0, tlx = 0, tly = 0;
  addEventListener('mousemove', (e) => { tlx = (e.clientX / innerWidth - 0.5) * 2; tly = (e.clientY / innerHeight - 0.5) * 2; });

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // ---------- loop ----------
  showActions(false);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const t = tweens[i]; t.t += dt;
      const k = Math.min(1, t.t / t.dur); t.fn(k);
      if (k >= 1) { tweens.splice(i, 1); t.res(); }
    }
    lookX += (tlx - lookX) * 0.06; lookY += (tly - lookY) * 0.06;
    shake *= 0.9;
    camera.position.set(CAM.x + (Math.random() - 0.5) * shake, CAM.y + (Math.random() - 0.5) * shake - camCrash * 0.9, CAM.z);
    camera.lookAt(lookX * 0.5, 1.0 - lookY * 0.25 - camCrash * 0.8, -1.5);
    camera.rotation.z = camCrash * 0.9;
    // dealer idle breathing
    if (!gameOver) torso.scale.y = 1 + Math.sin(now / 900) * 0.01;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
