<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Rat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Black+Ops+One&family=Graduate&family=Oswald:wght@500;700&family=Pacifico&display=swap">
<style>
  /* Layout: full-bleed 3D gym; a locker-room side panel for setup; broadcast-style HUD chips over the court */
  :root {
    --ink: #f4ece1; --muted: #b9ab98; --dim: #7d7163;
    --panel: rgba(23, 19, 16, 0.92); --panel-2: #2e2620; --line: rgba(244, 236, 225, 0.12);
    --ball: #ec7a2d; --ball-ink: #1d0f05;
    --good: #5bd68f; --warn: #f2c14e; --bad: #ef5b4c;
    --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --f-body: "Barlow", system-ui, sans-serif;
    --f-num: "Oswald", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120f0d; color: var(--ink); font-family: var(--f-body); font-size: 14px; }
  canvas#gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  .chip { position: fixed; background: rgba(18, 14, 11, 0.72); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .04em; pointer-events: none; display: flex; gap: 14px; align-items: baseline; white-space: nowrap; }
  .chip b { font-family: var(--f-num); font-weight: 500; font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .chip span { color: var(--muted); text-transform: uppercase; font-size: 13px; }
  #statline { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
  #modeline { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
  #hints { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-family: var(--f-display); font-size: 14px; letter-spacing: .03em; color: var(--muted); background: rgba(18, 14, 11, 0.6); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; line-height: 1.55; pointer-events: none; }
  #hints kbd { font-family: var(--f-num); font-size: 12px; color: var(--ink); background: #3a3029; border: 1px solid #54473c; border-radius: 4px; padding: 0 5px; margin-right: 3px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; --c: #fff; --s: 1; }
  #crosshair i { position: absolute; background: var(--c); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  #crosshair i:nth-child(1) { width: calc(2px * var(--s)); height: calc(8px * var(--s)); left: calc(-1px * var(--s)); top: calc(-13px * var(--s)); }
  #crosshair i:nth-child(2) { width: calc(2px * var(--s)); height: calc(8px * var(--s)); left: calc(-1px * var(--s)); top: calc(5px * var(--s)); }
  #crosshair i:nth-child(3) { height: calc(2px * var(--s)); width: calc(8px * var(--s)); top: calc(-1px * var(--s)); left: calc(-13px * var(--s)); }
  #crosshair i:nth-child(4) { height: calc(2px * var(--s)); width: calc(8px * var(--s)); top: calc(-1px * var(--s)); left: calc(5px * var(--s)); }
  #crosshair b { position: absolute; width: calc(4px * var(--s)); height: calc(4px * var(--s)); left: calc(-2px * var(--s)); top: calc(-2px * var(--s)); border-radius: 50%; background: var(--c); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  #crosshair.dot i { display: none; }
  #crosshair.cross b { display: none; }
  #crosshair.circle i { display: none; }
  #crosshair.circle b { width: calc(18px * var(--s)); height: calc(18px * var(--s)); left: calc(-9px * var(--s)); top: calc(-9px * var(--s)); background: none; border: 2px solid var(--c); box-sizing: border-box; }

  #meter { position: fixed; left: 0; top: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translate(-50%, -50%); }
  #meter .track { position: relative; width: 12px; height: 120px; border-radius: 6px; background: rgba(10, 8, 6, 0.75); border: 1px solid rgba(255,255,255,.25); overflow: hidden; }
  #meter .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #f6e7cf, #ffffff); }
  #meter .win { position: absolute; left: 0; right: 0; background: var(--good); opacity: .9; }
  #meter .grade { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .1em; text-shadow: 0 1px 6px #000; min-height: 18px; white-space: nowrap; }
  #meter.flash-good .fill { background: var(--good); }
  #meter.flash-ok .fill { background: var(--warn); }
  #meter.flash-bad .fill { background: var(--bad); }
  #toast { position: fixed; left: 50%; top: 24%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 800; font-size: 46px; letter-spacing: .08em; text-shadow: 0 3px 18px rgba(0,0,0,.7); pointer-events: none; opacity: 0; white-space: nowrap; }
  #toast small { display: block; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
  #toast.show { animation: pop 1.3s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateX(-50%) scale(.85); } 12% { opacity: 1; transform: translateX(-50%) scale(1.04); } 25% { transform: translateX(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #toast.show { animation: fade 1.3s linear forwards; } @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } } }
  /* ---------- Touch controls ---------- */
  #touch { position: fixed; inset: 0; --b: 1; -webkit-touch-callout: none; user-select: none; }
  #lookZone { position: absolute; inset: 0; touch-action: none; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 46%; height: 58%; touch-action: none; }
  #stickBase { position: absolute; width: calc(120px * var(--b)); height: calc(120px * var(--b)); margin: calc(-60px * var(--b)) 0 0 calc(-60px * var(--b)); border-radius: 50%; background: rgba(18, 14, 11, 0.35); border: 2px solid rgba(244, 236, 225, 0.35); pointer-events: none; left: calc(96px * var(--b) + env(safe-area-inset-left, 0px)); top: calc(100% - 110px * var(--b) - env(safe-area-inset-bottom, 0px)); }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: calc(54px * var(--b)); height: calc(54px * var(--b)); margin: calc(-27px * var(--b)) 0 0 calc(-27px * var(--b)); border-radius: 50%; background: rgba(244, 236, 225, 0.55); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .tb { position: absolute; border-radius: 50%; border: 2px solid rgba(244, 236, 225, 0.4); background: rgba(18, 14, 11, 0.45); color: var(--ink); font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; touch-action: none; width: calc(64px * var(--b)); height: calc(64px * var(--b)); font-size: calc(13px * var(--b)); padding: 0; }
  .tb.on { background: rgba(236, 122, 45, 0.75); border-color: var(--ball); color: var(--ball-ink); }
  #tShoot { width: calc(96px * var(--b)); height: calc(96px * var(--b)); font-size: calc(17px * var(--b)); right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); border-color: var(--ball); background: rgba(236, 122, 45, 0.35); }
  #tJump { right: calc(130px * var(--b) + 22px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #tCross { right: calc(40px * var(--b) + 22px + env(safe-area-inset-right, 0px)); bottom: calc(118px * var(--b) + 26px + env(safe-area-inset-bottom, 0px)); }
  #tSprint { right: calc(120px * var(--b) + 22px + env(safe-area-inset-right, 0px)); bottom: calc(96px * var(--b) + 26px + env(safe-area-inset-bottom, 0px)); }
  .ttop { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(56px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; }
  .ttop button { border: 1px solid rgba(244, 236, 225, 0.3); background: rgba(18, 14, 11, 0.6); color: var(--ink); border-radius: 8px; padding: calc(7px * var(--b)) calc(10px * var(--b)); font-family: var(--f-display); font-weight: 700; font-size: calc(13px * var(--b)); letter-spacing: .08em; touch-action: none; }
  @media (max-width: 720px) { .ttop { top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #paused { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(12, 9, 7, 0.45); cursor: pointer; }
  #paused div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 26px; text-align: center; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .06em; }
  #paused small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 14px; letter-spacing: 0; color: var(--muted); margin-top: 4px; }

  /* ---------- Menu ---------- */
  #menu { position: fixed; top: 0; bottom: 0; left: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); box-sizing: border-box; }
  #menu header { padding: 18px 20px 12px; display: grid; gap: 4px; }
  .brand { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .14em; color: var(--ball); line-height: 1; white-space: nowrap; }
  .brand-sub { color: var(--muted); font-family: var(--f-display); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; background: none; border: 0; padding: 10px 10px 9px; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ball); }
  .tabs button:hover { color: var(--ink); }
  #tabBody { flex: 1; overflow-y: auto; padding: 6px 20px 20px; scrollbar-width: thin; }
  .group { padding: 14px 0 6px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
  .group:last-child { border-bottom: 0; }
  .group h3 { margin: 0; font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .field { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 10px; }
  .field > label { color: var(--muted); font-size: 13px; }
  .field .val { font-family: var(--f-num); font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .range { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 0; }
  input[type="range"] { width: 100%; accent-color: var(--ball); min-width: 0; }
  input[type="text"], select { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid #4a3e34; border-radius: 6px; padding: 7px 9px; min-width: 0; }
  input[type="color"] { width: 34px; height: 28px; padding: 0; border: 1px solid #4a3e34; border-radius: 6px; background: var(--panel-2); cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--ball); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { background: var(--panel-2); border: 1px solid #4a3e34; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: var(--f-display); font-weight: 600; letter-spacing: .05em; }
  .seg button[aria-pressed="true"] { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); }
  #menu footer { padding: 12px 20px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .primary { flex: 1; background: var(--ball); color: var(--ball-ink); border: 0; border-radius: 8px; padding: 12px 16px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .primary:hover { filter: brightness(1.08); }
  .ghost { background: var(--panel-2); border: 1px solid #4a3e34; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; }

  .pos-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pos-card { background: var(--panel-2); border: 1px solid #4a3e34; border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; }
  .pos-card b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 800; letter-spacing: .06em; }
  .pos-card span { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
  .pos-card[aria-pressed="true"] { border-color: var(--ball); box-shadow: inset 0 0 0 1px var(--ball); }
  .pos-blurb { color: var(--muted); line-height: 1.45; margin: 0; }
  .ovr { display: flex; align-items: baseline; justify-content: space-between; }
  .ovr b { font-family: var(--f-num); font-size: 38px; font-weight: 700; color: var(--ball); line-height: 1; }
  .ovr span { font-family: var(--f-display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .rat { display: grid; grid-template-columns: 112px 1fr 32px 52px; gap: 8px; align-items: center; }
  .rat label { color: var(--muted); font-size: 13px; }
  .rat .bar { height: 8px; background: #3a3029; border-radius: 4px; overflow: hidden; position: relative; }
  .rat .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ball); border-radius: 4px; }
  .rat .bar em { position: absolute; top: 0; bottom: 0; background: var(--good); }
  .rat .n { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
  .rat .pm { display: flex; gap: 3px; }
  .rat .pm button { width: 24px; height: 22px; border-radius: 5px; border: 1px solid #4a3e34; background: var(--panel-2); cursor: pointer; padding: 0; line-height: 1; }
  .rat .pm button:disabled { opacity: .3; cursor: default; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; }
  .stat b { display: block; font-family: var(--f-num); font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-family: var(--f-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #chart { width: 100%; height: auto; border-radius: 8px; background: #2a221c; display: block; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .note { color: var(--dim); font-size: 12px; line-height: 1.45; margin: 0; }

  @media (max-width: 720px) {
    #menu { top: auto; height: 62%; width: 100%; border-right: 0; border-top: 1px solid var(--line); padding-right: env(safe-area-inset-right, 0px); }
    #hints { display: none; }
    .field { grid-template-columns: 100px 1fr; }
    .chip { font-size: 13px; gap: 9px; }
    #modeline { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="statline" class="chip"></div>
<div id="modeline" class="chip"></div>
<div id="hints"></div>
<div id="crosshair" class="cross"><i></i><i></i><i></i><i></i><b></b></div>
<div id="meter" hidden><div class="grade"></div><div class="track"><div class="win"></div><div class="fill"></div></div></div>
<div id="toast"></div>
<div id="touch" hidden>
  <div id="lookZone"></div>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <button id="tShoot" class="tb" type="button">SHOOT</button>
  <button id="tJump" class="tb" type="button">JUMP</button>
  <button id="tCross" class="tb" type="button">CROSS</button>
  <button id="tSprint" class="tb" type="button">SPRINT</button>
  <div class="ttop"><button type="button" data-k="KeyV">CAM</button><button type="button" data-k="KeyR">RACK</button><button type="button" data-k="KeyG">DROP</button><button type="button" data-k="KeyM">MENU</button></div>
</div>
<div id="paused" hidden><div>Click to keep shooting<small>Press M for the menu</small></div></div>
<div id="menu">
  <header><div class="brand">GYM RAT</div><div class="brand-sub">Your player · your gym</div></header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="tabBody"></div>
  <footer><button class="primary" id="playBtn">Start shooting</button><button class="ghost" id="spinBtn" title="Turn the preview">Turn</button></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const LIN = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const ftin = (m) => { let i = Math.round(m / 0.0254), f = Math.floor(i / 12); i -= f * 12; return `${f}'${i}"`; };
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// =====================================================================
//  Court constants (NBA dimensions, metres). Court length runs along X.
// =====================================================================
const CH = { hx: 14.325, hz: 7.62 };
const RIM_Y = 3.048, RIM_R = 0.2286, RIM_TUBE = 0.0095, RIM_C = RIM_R + RIM_TUBE;
const RIM_X = 12.725, BOARD_X = 13.106, BOARD_BOTTOM = 2.9;

const G = 9.81, DRAG = 0.0206, MAGNUS = 0.0052;
const POST_X = CH.hx + 1.25;

const POS = {
  PG: { name: 'Point Guard', h: 1.88, blurb: 'Runs the floor. Best handle on the team and the quickest release.', r: { three: 82, mid: 80, close: 70, ft: 86, handle: 94, speed: 92, vertical: 78, release: 90 } },
  SG: { name: 'Shooting Guard', h: 1.96, blurb: 'Lives behind the arc. The widest green window from deep.', r: { three: 90, mid: 85, close: 72, ft: 88, handle: 82, speed: 85, vertical: 82, release: 86 } },
  SF: { name: 'Small Forward', h: 2.03, blurb: 'Three-level scorer. Balanced at every distance.', r: { three: 80, mid: 82, close: 80, ft: 80, handle: 75, speed: 80, vertical: 86, release: 80 } },
  PF: { name: 'Power Forward', h: 2.06, blurb: 'Owns the mid-post. Strong finisher, steady from fifteen feet.', r: { three: 66, mid: 80, close: 88, ft: 74, handle: 64, speed: 72, vertical: 80, release: 72 } },
  C: { name: 'Center', h: 2.13, blurb: 'Dominates the paint. Soft touch near the rim, slow from deep.', r: { three: 48, mid: 66, close: 94, ft: 64, handle: 52, speed: 64, vertical: 74, release: 62 } },
};
const STATS = [['three', '3-Point Shot'], ['mid', 'Mid-Range'], ['close', 'Close Shot'], ['ft', 'Free Throw'], ['handle', 'Ball Handle'], ['speed', 'Speed'], ['vertical', 'Vertical'], ['release', 'Release Speed']];
const POINT_POOL = 15, BONUS_MAX = 10;
const FONTS = [['Oswald', 'Block', 700], ['Bebas Neue', 'Modern', 400], ['Graduate', 'Collegiate', 400], ['Alfa Slab One', 'Slab', 400], ['Black Ops One', 'Stencil', 400], ['Pacifico', 'Script', 400]];
const WOODS = {
  maple: { label: 'Natural maple', base: [222, 176, 120], v: 14, grain: [160, 112, 66] },
  honey: { label: 'Honey oak', base: [198, 138, 76], v: 18, grain: [128, 78, 38] },
  walnut: { label: 'Dark walnut', base: [112, 74, 47], v: 13, grain: [62, 39, 24] },
  gray: { label: 'Gray wash', base: [158, 154, 146], v: 10, grain: [108, 104, 98] },
  white: { label: 'Whitewash', base: [230, 218, 198], v: 9, grain: [186, 166, 140] },
  ebony: { label: 'Ebony stain', base: [56, 43, 36], v: 8, grain: [26, 19, 15] },
};

// =====================================================================
//  Config (persisted per viewer)
// =====================================================================
const DEFAULT_CFG = {
  player: {
    name: 'CARTER', number: '23', team: 'GYM RATS', position: 'SG', height: 1.96,
    bonus: { three: 0, mid: 0, close: 0, ft: 0, handle: 0, speed: 0, vertical: 0, release: 0 },
    skin: '#8d5a3b', hair: 'fade', hairColor: '#0e0b0a', beard: 'none',

function animatePlayer(dt) {
  const rg = pl.rig; if (!rg) return;
  const s = pl.scale;

  const spd = clamp(pl.speed / 6, 0, 1), ph = pl.phase;

  const m = shooting ? pl.shotT / pl.fill : 0;

    kn.rotation.x = Math.max(0, -Math.cos(ph + (sgn > 0 ? 0 : Math.PI))) * 1.1 * spd + crouch * 1.6 + airTuck * 1.1;
    ft.rotation.x = -crouch * 0.6 + sw * 0.2 * spd;
    th.rotation.z = sgn * 0.04;
  }
  const bob = Math.abs(Math.sin(ph)) * 0.035 * spd;
  rg.hips.position.y = 1.03 - crouch * 0.11 - airTuck * 0.05 + bob;
  rg.spine.rotation.x = (pl.ball ? 0.14 : 0.06) + spd * 0.12 + crouch * 0.25 - (shooting ? 0.12 * smooth(m / 0.6) : 0);
  rg.spine.rotation.y = Math.sin(ph) * 0.12 * spd;
  rg.neck.rotation.x = -rg.spine.rotation.x * 0.7 + (cfg.settings.camera === 'third' && !menuOpen ? -camPitch * 0.3 : 0);
  rg.root.updateMatrixWorld(true);
  // arms
  const f = playerFwd(), r = playerRight(), up = new V3(0, 1, 0);
  const a = 0.31 * s, bl = 0.28 * s;
  const shoulder = (sh) => sh.getWorldPosition(new V3());
  const SL = shoulder(rg.shL), SR = shoulder(rg.shR);
  const pole = (Sp, side, down) => Sp.clone().addScaledVector(r, -side * 0.35).addScaledVector(f, -0.3).addScaledVector(up, -down);
  const b = pl.ball;
  let tL, tR, pL = pole(SL, -1, 0.3), pR = pole(SR, 1, 0.3);
  if (b && shooting) {
    tR = b.pos.clone().addScaledVector(f, -(BALL_R + 0.05 * s)).addScaledVector(up, -0.05 * s);
    tL = b.pos.clone().addScaledVector(r, -(BALL_R + 0.04 * s)).addScaledVector(f, -0.02);
    pR = SR.clone().addScaledVector(up, -0.5).addScaledVector(r, 0.15).addScaledVector(f, 0.1);
    pL = SL.clone().addScaledVector(up, -0.5).addScaledVector(r, -0.3);
  } else if (b) {
    const handSide = pl.crossT >= 0 ? (pl.crossT < 0.5 ? pl.crossFrom : -pl.crossFrom) : pl.side;
    const handTop = b.pos.clone().addScaledVector(up, BALL_R + 0.1 * s);
    const hover = pl.pos.clone().addScaledVector(r, 0.3 * s * handSide).addScaledVector(f, 0.36 * s).setY(pl.y + 0.98 * s);
    const tDrib = b.pos.y + BALL_R > hover.y - 0.25 * s ? handTop : hover;
    const guard = pl.pos.clone().addScaledVector(r, -0.36 * s * handSide).addScaledVector(f, 0.3 * s).setY(pl.y + 1.12 * s);
    if (handSide > 0) { tR = tDrib; tL = guard; } else { tL = tDrib; tR = guard; }
    pR = SR.clone().addScaledVector(r, 0.4).addScaledVector(f, -0.25); pL = SL.clone().addScaledVector(r, -0.4).addScaledVector(f, -0.25);
  } else if (follow) {
    const k = smooth(pl.followT / 0.2) * (1 - smooth((pl.followT - 0.35) / 0.2));
    const hi = pl.pos.clone().setY(pl.y + 2.2 * s).addScaledVector(f, 0.42 * s);
    const lo = (Sp, side) => Sp.clone().addScaledVector(up, -0.55 * s).addScaledVector(r, side * 0.1);
    tR = lo(SR, 1).lerp(hi.clone().addScaledVector(r, 0.07 * s), k); tL = lo(SL, -1).lerp(hi.clone().addScaledVector(r, -0.12 * s).addScaledVector(up, -0.1 * s), k);
    pR = SR.clone().addScaledVector(up, -0.4).addScaledVector(r, 0.2); pL = SL.clone().addScaledVector(up, -0.4).addScaledVector(r, -0.2);
  } else {
    const sw = Math.sin(ph) * 0.42 * spd;
    tL = SL.clone().addScaledVector(up, -0.56 * s).addScaledVector(r, -0.07 * s).addScaledVector(f, -sw * s * 0.5 + 0.03);
    tR = SR.clone().addScaledVector(up, -0.56 * s).addScaledVector(r, 0.07 * s).addScaledVector(f, sw * s * 0.5 + 0.03);
  }
  ikArm(rg.uaL, rg.faL, tL, pL, a, bl); ikArm(rg.uaR, rg.faR, tR, pR, a, bl);
  rg.hdR.rotation.x = shooting ? -0.6 : follow ? 0.9 : b ? 0.25 : 0.1;
  rg.hdL.rotation.x = b && !shooting ? 0.1 : 0.05;
}

// =====================================================================
//  Camera
// =====================================================================
function updateCamera(dt) {
  const S = cfg.settings, s = pl.scale;
  camera.fov = S.fov; camera.updateProjectionMatrix();
  if (menuOpen) {
    if (activeTab === 'court') {
      const c = cfg.court, a = previewYaw * 0.3 + performance.now() * 0.00004;
      camera.position.set(Math.cos(a) * c.length * 0.42, c.height * 0.55, Math.sin(a) * c.width * 0.42 + 2);
      camera.lookAt(0, 0.5, 0);
    } else {
      const back = activeTab === 'jersey' ? Math.PI : 0;
      const a = pl.yaw + back + previewYaw;
      const tgt = new V3(pl.pos.x, pl.y + 1.25 * s, pl.pos.z);
      const off = innerWidth > 720 ? -0.55 : 0;
      camera.position.set(tgt.x + Math.sin(a) * 3.3 * s, tgt.y + 0.2, tgt.z + Math.cos(a) * 3.3 * s);
      camera.lookAt(tgt); camera.translateX(off);
      if (innerWidth <= 720) camera.translateY(-0.9);
    }
    return;
  }
  const dir = new V3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));
  if (S.camera === 'first') {
    pl.rig.head.getWorldPosition(_v1);
    camera.position.copy(_v1).add(new V3(0, 0.1 * s, 0)).addScaledVector(new V3(dir.x, 0, dir.z).normalize(), 0.12 * s);
    camera.lookAt(camera.position.clone().add(dir));
  } else {
    const right = new V3(-Math.cos(camYaw), 0, Math.sin(camYaw));
    const anchor = new V3(pl.pos.x, pl.y * 0.2 + 1.62 * s, pl.pos.z); // damp the jump so the crosshair stays on target
    const pos = anchor.clone().addScaledVector(dir, -camDist).addScaledVector(right, 0.6).add(new V3(0, 0.22, 0));
    pos.x = clamp(pos.x, -world.walls.x + 0.25, world.walls.x - 0.25); pos.z = clamp(pos.z, -world.walls.z + 0.25, world.walls.z - 0.25); pos.y = clamp(pos.y, 0.3, world.walls.h - 0.4);
    camera.position.lerp(pos, 1 - Math.exp(-dt * 30));
    camera.lookAt(camera.position.clone().add(dir));
  }
}

  bounce(v, pos, dribble) { if (!gate(dribble ? 'db' : 'b' + (pos.x | 0), 45)) return; const k = clamp(v / 6, 0.08, 1); tone('sine', 150, 55, 0.13, 0.5 * k, pos); noise('lowpass', 900, 0.7, 0.06, 0.35 * k, pos); },

  board(v, pos) { if (!gate('board', 80)) return; const k = clamp(v / 6, 0.1, 1); tone('sine', 95, 60, 0.18, 0.4 * k, pos); noise('bandpass', 420, 1.2, 0.2, 0.35 * k, pos); },

function drawChart(cv) {
  const g = cv.getContext('2d'), W = cv.width, Hh = cv.height, k = (W - 40) / (CH.hx * 2), ox = W / 2, oz = Hh / 2;

  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; g.strokeRect(X(-CH.hx), Z(-CH.hz), CH.hx * 2 * k, CH.hz * 2 * k);

  const t0 = Math.asin(CORNER_Z / THREE_R);

    g.strokeRect(X(Math.min(s * CH.hx, s * FT_X)), Z(-LANE_HZ), (CH.hx - FT_X) * k, LANE_HZ * 2 * k);
    const xa = s * (RIM_X - Math.sqrt(THREE_R ** 2 - CORNER_Z ** 2));

}

const stickBase = $('#stickBase'), stickKnob = $('#stickKnob');

$('#stickZone').addEventListener('pointerdown', (e) => {

  stick.id = e.pointerId; e.currentTarget.setPointerCapture(e.pointerId);
  const r = e.currentTarget.getBoundingClientRect(); stick.ox = e.clientX; stick.oy = e.clientY;
  stickBase.style.left = `${e.clientX - r.left}px`; stickBase.style.top = `${e.clientY - r.top}px`;
