<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>Evacuate</title>
<style>body{margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font:bold 18px sans-serif;color:#fff;text-shadow:0 0 4px #000}
#m{position:fixed;top:10px;width:100%;text-align:center;pointer-events:none}
#r{position:fixed;bottom:30px;left:30px;width:90px;height:90px;border-radius:50%;background:#fff5;display:grid;place-items:center}</style>
<div id=m>Tap to wake up</div><div id=r>RUN</div>
<script src=https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js></script>
<script>
const T=THREE,sc=new T.Scene,cam=new T.PerspectiveCamera(75,1,.1,900),rn=new T.WebGLRenderer({antialias:1}),S=[],D=[],L={},K={},R=Math.random,
B=(w,h,d,x,y,z,c,s,par)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));o.position.set(x,y,z);(par||sc).add(o);s&&S.push([x,z,w/2+.3,d/2+.3]);return o};
document.body.append(rn.domElement);rn.setPixelRatio(Math.min(2,devicePixelRatio));sc.background=new T.Color(0x88ccff);cam.rotation.order='YXZ';
(onresize=()=>{rn.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()})();
sc.add(new T.AmbientLight(0xffffff,.7));const sun=new T.DirectionalLight(0xffffff,.6);sun.position.set(30,60,20);sc.add(sun);
// world: grass, street, sidewalk, floor, ceiling, walls (front wall has window + door holes), goal tower
[[900,.1,900,0,-.06,0,0x44aa44],[900,.1,14,0,0,15,0x333333],[900,.12,3.5,0,0,5.3,0xbbbbbb],[6.4,.1,6.4,0,.02,0,0x996633],[6.4,.2,6.4,0,3.1,0,0xeeeeee],
[6.4,3,.2,0,1.5,-3.1],[.2,3,6.4,-3.1,1.5,0],[.2,3,6.4,3.1,1.5,0],[1.2,2.2,.2,-2.6,1.1,3.1],[2,1,.2,-1,.5,3.1],[6.4,.8,.2,0,2.6,3.1],[1.5,2.2,.2,.75,1.1,3.1],[.7,2.2,.2,2.85,1.1,3.1],
[1,6,1,-70,3,5.3,0x00ff00]].forEach(a=>B(...a.slice(0,6),a[6]||0xddccbb));
// furniture: bed, pillow, nightstand, lamp, dresser, closet, closet seam
B(1.6,.5,2.2,-2.1,.25,-1.8,0x3366cc,1);B(1.4,.15,.5,-2.1,.55,-2.6,0xffffff);B(.6,.6,.6,-.9,.3,-2.6,0x885522,1);B(.2,.4,.2,-.9,.8,-2.6,0xffee88);
B(.6,1,1.6,-2.6,.5,1.5,0x885522,1);B(.8,2.4,1.8,2.5,1.2,-1.8,0x663300,1);B(.05,2.2,.05,2.08,1.2,-1.8,0x111111);
const gl=B(2,1.2,.05,-1,1.6,3.1,0xaaeeff);gl.material.transparent=1;gl.material.opacity=.3;
const dg=new T.Group;dg.position.set(1.5,0,3.1);sc.add(dg);B(1,2.2,.08,.5,1.1,0,0x774411,0,dg);
for(let i=-8;i<9;i++){const h=10+R()*20;B(18,h,12,i*22,h/2,32,0x9999aa)}
const cars=[];for(let i=0;i<8;i++){const c=B(4,1.4,1.9,i*25-90,.75,i%2?12:18,[0xcc2222,0x2222cc,0xdddd22,0xeeeeee][i%4]);c.s=i%2?9:-9;cars.push(c)}
// plane: fuselage + wings, tail, engines
const pl=new T.Group;sc.add(pl);pl.position.y=999;
const fu=new T.Mesh(new T.CylinderGeometry(1.6,1.6,30,12),new T.MeshLambertMaterial({color:0xeeeeee}));fu.rotation.z=1.57;pl.add(fu);
const pw=[B(4,.3,20,0,-.3,0,0xcccccc,0,pl),B(3,4,.3,-13,2.5,0,0x2222cc,0,pl),B(2,1,1,2,-1.2,5,0x888888,0,pl),B(2,1,1,2,-1.2,-5,0x888888,0,pl)];
const fire=new T.Mesh(new T.SphereGeometry(1,12,8),new T.MeshBasicMaterial({color:0xff6600}));fire.visible=0;sc.add(fire);
let p={x:-2.1,z:-2.2},eh=.8,yaw=Math.PI,pit=1.2,t=0,ph=0,pv=0,tm=25,sh=0,run=0,boom=0,ac,last=0;
const rum=(f,g,s)=>{const o=ac.createOscillator(),a=ac.createGain();o.type='sawtooth';o.frequency.value=f;a.gain.value=g;a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+s);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+s)},
dyn=(o,vx)=>{o.v=new T.Vector3(vx*R()+(R()-.5)*20,5+R()*25,(R()-.5)*40);o.w=R()*8;D.push(o)},
ok=(x,z)=>(z>3.5||(Math.abs(x-2)<.35&&z>2)||(Math.abs(x)<2.7&&z>-2.7&&z<2.7))&&!S.some(a=>Math.abs(x-a[0])<a[2]&&Math.abs(z-a[1])<a[3]),
end=(s,b)=>{ph=3;t=0;m.textContent=s+' Tap to play again';if(b){boom=1;sh=2;fire.visible=1;rum(40,1,8)}};
onclick=()=>{if(!ph){ph=1;p={x:-.8,z:-1.2};eh=1.6;pit=0;ac=new(window.AudioContext||webkitAudioContext);m.textContent='Good morning! Go look out the window…'}else if(ph>2&&t>1)location.reload()};
rn.domElement.onpointerdown=e=>L[e.pointerId]=[e.clientX,e.clientY];
onpointermove=e=>{const l=L[e.pointerId];if(l){yaw-=(e.clientX-l[0])*.005;pit=Math.max(-1.5,Math.min(1.5,pit-(e.clientY-l[1])*.005));L[e.pointerId]=[e.clientX,e.clientY]}};
onpointerup=onpointercancel=e=>delete L[e.pointerId];
r.onpointerdown=()=>run=1;r.onpointerup=r.onpointerleave=r.onpointercancel=()=>run=0;
onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;
function loop(n){const dt=Math.min(.05,(n-last)/1e3);last=n;t+=dt;
 if(ph==1||ph==2){const f=(K.w||run?1:0)-(K.s?1:0),s=(K.d?1:0)-(K.a?1:0),dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*6*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*6*dt;
  if(ok(p.x+dx,p.z))p.x+=dx;if(ok(p.x,p.z+dz))p.z+=dz}
 cars.forEach(c=>{if(!c.v){c.position.x+=c.s*dt;if(Math.abs(c.position.x)>110)c.position.x*=-1}});
 if(ph==1&&t>4){const u=9-t;pl.a||(pl.a=1,rum(110,.2,6));pl.position.set(-10-70*u,1.6+25*u,15);pl.rotation.z=-.34;
  if(u<=0){ph=2;pv=70;sh=.7;pl.rotation.z=0;gl.visible=0;fire.visible=1;rum(45,1,6);rum(70,.8,4);navigator.vibrate&&navigator.vibrate(1500);
   pw.forEach(o=>{sc.attach(o);dyn(o,40)});cars.forEach(c=>c.s=0);
   for(let i=0;i<200;i++){const z=.2+R()*.6;dyn(B(z,z,z,R()*30-25,1,12+R()*6,R()<.5?0xcccccc:0x444444),40)}}}
 if(ph==2){pv*=Math.exp(-2.3*dt);pl.position.x+=pv*dt;sh=Math.max(sh*Math.exp(-.5*dt),pv/200);tm-=dt;
  cars.forEach(c=>{if(!c.v&&pv>3&&Math.abs(c.position.x-pl.position.x)<17){dyn(c,pv);sh+=.3}});
  m.textContent='💥 EVACUATE! Out the door, run RIGHT down the sidewalk to the green tower — '+tm.toFixed(1)+'s';
  if(p.x<-68&&p.z>3.5)end('✅ You escaped!');else if(tm<=0)end('🔥 The fuel exploded…',1)}
 if(fire.visible){fire.position.copy(pl.position);boom?fire.scale.multiplyScalar(1+2*dt):fire.scale.setScalar(3+R()*2)}
 sh*=Math.exp(-.3*dt);
 D.forEach(o=>{o.v.y-=20*dt;o.position.addScaledVector(o.v,dt);o.rotation.x+=o.w*dt;o.rotation.z+=o.w*dt;if(o.position.y<.4){o.position.y=.4;o.v.y*=-.4;o.v.x*=.7;o.v.z*=.7;o.w*=.6}});
 dg.rotation.y+=((Math.hypot(p.x-2,p.z-3)<2?1.5:0)-dg.rotation.y)*.1;
 cam.position.set(p.x+(R()-.5)*sh,eh+(R()-.5)*sh,p.z+(R()-.5)*sh);cam.rotation.set(pit,yaw,(R()-.5)*sh*.1);
 rn.render(sc,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
