<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Dummy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  #help { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 8px; background: rgba(15,20,30,.65); color: #fff; font-size: 13px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="help">Drag him to walk him around &middot; hold Shift while dragging to pick him up &middot; drag empty space to orbit &middot; wheel to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wrapA = (a) => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };

  // ---------- scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe3f2);
  scene.fog = new THREE.Fog(0xcfe3f2, 25, 60);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a5, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(6, 12, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
  scene.add(sun, sun.target);

  const floorTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    g.fillStyle = '#b9c4cf'; g.fillRect(0, 0, 256, 256); g.fillStyle = '#a9b6c3'; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t;
  })();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---------- the dummy (a little skeleton of pivot groups) ----------
  const M = (c, r = 0.7) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const skin = M(0xe0b08a, 0.6), shirt = M(0x3f6fb0), pants = M(0x343a47), shoe = M(0x1c1c20, 0.5), hair = M(0x3b2a1e), white = M(0xffffff, 0.3), dark = M(0x111111, 0.4);
  function mesh(geo, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m; }
  // a tapered limb segment hanging down from its pivot, with a rounded joint at the top and bottom
  function segment(len, r0, r1, mat, parent) {
    const g = new THREE.Group(); parent.add(g);
    mesh(new THREE.CylinderGeometry(r0, r1, len, 16), mat, 0, -len / 2, 0, g);
    mesh(new THREE.SphereGeometry(r0, 16, 12), mat, 0, 0, 0, g);
    return g;
  }

  const root = new THREE.Group(); scene.add(root);                       // faces +z
  const hips = new THREE.Group(); hips.position.y = 0.95; root.add(hips);
  mesh(new THREE.BoxGeometry(0.34, 0.2, 0.2), pants, 0, 0.02, 0, hips);
  const torso = new THREE.Group(); torso.position.y = 0.1; hips.add(torso);
  const chest = mesh(new THREE.BoxGeometry(0.4, 0.56, 0.23), shirt, 0, 0.28, 0, torso);
  mesh(new THREE.BoxGeometry(0.42, 0.1, 0.24), shirt, 0, 0.53, 0, torso);
  const neck = new THREE.Group(); neck.position.y = 0.6; torso.add(neck);
  mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.1, 12), skin, 0, 0.04, 0, neck);
  const head = new THREE.Group(); head.position.y = 0.1; neck.add(head);
  mesh(new THREE.SphereGeometry(0.115, 24, 18), skin, 0, 0.12, 0, head).scale.set(0.95, 1.12, 1);
  mesh(new THREE.SphereGeometry(0.12, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.52), hair, 0, 0.14, -0.012, head).scale.set(1, 1.1, 1.02);
  const eyes = [];
  for (const sx of [-1, 1]) {
    mesh(new THREE.SphereGeometry(0.02, 10, 8), white, sx * 0.04, 0.14, 0.098, head);
    eyes.push(mesh(new THREE.SphereGeometry(0.011, 8, 8), dark, sx * 0.04, 0.14, 0.116, head));
  }
  mesh(new THREE.BoxGeometry(0.05, 0.012, 0.01), dark, 0, 0.065, 0.11, head);                 // mouth
  mesh(new THREE.SphereGeometry(0.018, 8, 8), skin, 0, 0.115, 0.118, head);                   // nose

  function makeArm(side) {
    const shoulder = new THREE.Group(); shoulder.position.set(side * 0.255, 0.5, 0); torso.add(shoulder);
    const upper = segment(0.3, 0.055, 0.045, shirt, shoulder); upper.position.y = 0;
    const fore = segment(0.28, 0.045, 0.036, skin, upper); fore.position.y = -0.3;
    mesh(new THREE.SphereGeometry(0.045, 12, 10), skin, 0, -0.29, 0, fore);                   // hand
    return { shoulder, upper, fore };
  }
  function makeLeg(side) {
    const thigh = segment(0.45, 0.075, 0.06, pants, hips); thigh.position.set(side * 0.095, -0.02, 0);
    const shin = segment(0.45, 0.06, 0.045, pants, thigh); shin.position.y = -0.45;
    const foot = new THREE.Group(); foot.position.y = -0.45; shin.add(foot);
    mesh(new THREE.BoxGeometry(0.1, 0.07, 0.27), shoe, 0, -0.03, 0.06, foot);
    return { thigh, shin, foot };
  }
  const arms = [makeArm(-1), makeArm(1)], legs = [makeLeg(-1), makeLeg(1)];     // [0] = his left? (-x), [1] = +x
  const pickables = [];
  root.traverse((o) => { if (o.isMesh) pickables.push(o); });

  // contact shadow blob under him (also follows when lifted)
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), new THREE.MeshBasicMaterial({
    map: (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 4, 32, 32, 32);
      r.addColorStop(0, 'rgba(0,0,0,.35)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })(),
    transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.01; scene.add(blob);

  // ---------- state ----------
  const S = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(), yaw: 0, phase: 0, walk: 0, run: 0, lift: 0, t: 0, held: false, lifted: false, target: new THREE.Vector3(), grabOff: new THREE.Vector3(), lean: 0, sway: new THREE.Vector2() };

  // ---------- animation ----------
  function animate(dt) {
    S.t += dt;
    // movement: follow the dragged target on the ground
    const speedBefore = S.vel.length();
    if (S.held) {
      const d = new THREE.Vector3().subVectors(S.target, S.pos); d.y = 0;
      const dist = d.length(), want = Math.min(dist * 5, S.lifted ? 9 : 5.2);
      const desired = dist > 0.01 ? d.multiplyScalar(want / dist) : d.set(0, 0, 0);
      S.vel.lerp(desired, 1 - Math.exp(-dt * 10));
    } else S.vel.multiplyScalar(Math.exp(-dt * 12));
    S.pos.addScaledVector(S.vel, dt);
    S.pos.x = clamp(S.pos.x, -28, 28); S.pos.z = clamp(S.pos.z, -28, 28);
    const speed = S.vel.length();
    S.lift = lerp(S.lift, S.held && S.lifted ? 0.42 : 0, 1 - Math.exp(-dt * 9));

    // facing
    if (speed > 0.25) S.yaw += wrapA(Math.atan2(S.vel.x, S.vel.z) - S.yaw) * (1 - Math.exp(-dt * 9));
    // gait blend
    const walkT = S.lifted && S.held ? 0 : clamp(speed / 1.1, 0, 1), runT = clamp((speed - 2.4) / 2.2, 0, 1);
    S.walk = lerp(S.walk, walkT, 1 - Math.exp(-dt * 10)); S.run = lerp(S.run, runT, 1 - Math.exp(-dt * 6));
    if (speed > 0.05 && !(S.lifted && S.held)) S.phase += (speed / 1.45) * Math.PI * 2 * dt * (1 - 0.15 * S.run);

    const w = S.walk, r = S.run, idle = 1 - w, ph = S.phase;
    const sL = Math.sin(ph), sR = Math.sin(ph + Math.PI), cL = Math.cos(ph), cR = Math.cos(ph + Math.PI);
    const A = lerp(0.5, 0.95, r), K = lerp(0.8, 1.7, r);

    // body
    root.position.set(S.pos.x, S.lift, S.pos.z);
    root.rotation.y = S.yaw;
    const breath = Math.sin(S.t * 1.8);
    S.lean = lerp(S.lean, clamp(speed * 0.045, 0, 0.3) * (S.lifted && S.held ? 0 : 1), 1 - Math.exp(-dt * 6));
    hips.position.y = 0.95 - 0.02 * w - 0.05 * r + (0.03 * Math.abs(cL) * w) + (S.lifted && S.held ? 0 : 0);
    hips.position.x = sL * 0.02 * w + Math.sin(S.t * 0.5) * 0.006 * idle;
    hips.rotation.y = sL * 0.14 * w;
    hips.rotation.z = -sL * 0.03 * w + Math.sin(S.t * 0.5) * 0.012 * idle;
    torso.rotation.set(S.lean + breath * 0.008 * idle, -sL * 0.2 * w, sL * 0.025 * w);
    chest.scale.set(1 + breath * 0.012 * idle, 1 + breath * 0.008 * idle, 1 + breath * 0.02 * idle);

    // head looks at the camera when standing, forward when walking
    const toCam = new THREE.Vector3().subVectors(camera.position, root.position).applyAxisAngle(new THREE.Vector3(0, 1, 0), -S.yaw);
    const lookYaw = clamp(Math.atan2(toCam.x, toCam.z), -1.1, 1.1) * idle, lookPitch = clamp(-Math.atan2(toCam.y - 1.6, Math.hypot(toCam.x, toCam.z)), -0.4, 0.35) * idle;
    head.rotation.y = lerp(head.rotation.y, lookYaw - torso.rotation.y * 0.6, 1 - Math.exp(-dt * 6));
    head.rotation.x = lerp(head.rotation.x, lookPitch - S.lean * 0.6, 1 - Math.exp(-dt * 6));
    neck.rotation.y = 0;
    const blinkOn = (S.t % 4.2) > 4.05; eyes.forEach((e) => (e.scale.y = blinkOn ? 0.1 : 1));

    // legs & arms
    const dangle = S.lifted && S.held ? 1 : 0, sw = S.vel.length() * 0.1;
    const legSet = [[sL, cL], [sR, cR]];
    legs.forEach((L, i) => {
      const [s, c] = legSet[i];
      let thigh = -s * A * w, knee = Math.max(0, c) * K * w + 0.06 * w;
      if (dangle) { thigh = 0.1 + Math.sin(S.t * 2.6 + i * 1.5) * 0.12 + sw; knee = 0.15 + Math.max(0, Math.sin(S.t * 2.6 + i * 1.5 + 1)) * 0.2; }
      L.thigh.rotation.x = lerp(L.thigh.rotation.x, thigh, 1 - Math.exp(-dt * 20));
      L.shin.rotation.x = lerp(L.shin.rotation.x, knee, 1 - Math.exp(-dt * 20));
      L.thigh.rotation.z = (i ? -1 : 1) * 0.02 * idle;
      L.foot.rotation.x = -(L.thigh.rotation.x + L.shin.rotation.x) * (dangle ? 0.2 : 0.7) + (dangle ? 0.5 : 0);
    });
    arms.forEach((a, i) => {
      const [s] = legSet[i];
      let up = s * A * 0.85 * w, el = -0.12 - 0.25 * w - 0.7 * r * w, out = 0.06 + 0.02 * w;
      if (dangle) { up = -0.15 + Math.sin(S.t * 2.2 + i) * 0.1; el = -0.2; out = 0.18 + Math.sin(S.t * 3 + i * 2) * 0.05; }
      a.upper.rotation.x = lerp(a.upper.rotation.x, up + Math.sin(S.t * 1.8 + i) * 0.01 * idle, 1 - Math.exp(-dt * 16));
      a.upper.rotation.z = (i ? -1 : 1) * out;
      a.fore.rotation.x = lerp(a.fore.rotation.x, el, 1 - Math.exp(-dt * 16));
    });
    blob.position.x = S.pos.x; blob.position.z = S.pos.z;
    const bs = 1 + S.lift * 0.9; blob.scale.set(bs, bs, 1); blob.material.opacity = 1 - S.lift * 0.9;
  }

  // ---------- camera orbit + dragging ----------
  const cam = { yaw: 0.6, pitch: 0.38, dist: 6.5, look: new THREE.Vector3(0, 1, 0) };
  const cv = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  let orbiting = false, lx = 0, ly = 0;
  function setNdc(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); }
  function groundHit(e, out) { setNdc(e); return ray.ray.intersectPlane(groundPlane, out); }
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId); lx = e.clientX; ly = e.clientY;
    setNdc(e);
    if (ray.intersectObjects(pickables, false).length) {
      const g = new THREE.Vector3(); if (!groundHit(e, g)) return;
      S.held = true; S.lifted = e.shiftKey; S.grabOff.set(S.pos.x - g.x, 0, S.pos.z - g.z); S.target.copy(S.pos);
      cv.classList.add('grabbing');
    } else orbiting = true;
  });
  cv.addEventListener('pointermove', (e) => {
    if (S.held) {
      S.lifted = e.shiftKey;
      const g = new THREE.Vector3(); if (groundHit(e, g)) S.target.set(g.x + S.grabOff.x, 0, g.z + S.grabOff.z);
    } else if (orbiting) {
      cam.yaw -= (e.clientX - lx) * 0.006; cam.pitch = clamp(cam.pitch + (e.clientY - ly) * 0.005, 0.05, 1.45);
      lx = e.clientX; ly = e.clientY;
    }
  });
  const release = () => { S.held = false; S.lifted = false; orbiting = false; cv.classList.remove('grabbing'); };
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
  cv.addEventListener('wheel', (e) => { cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.001), 2.5, 22); e.preventDefault(); }, { passive: false });
  addEventListener('keydown', (e) => { if (e.key === 'Shift' && S.held) S.lifted = true; });
  addEventListener('keyup', (e) => { if (e.key === 'Shift') S.lifted = false; });

  function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    animate(dt);
    // camera eases toward him
    cam.look.lerp(new THREE.Vector3(S.pos.x, 1 + S.lift * 0.5, S.pos.z), 1 - Math.exp(-dt * 3));
    camera.position.set(cam.look.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cam.look.y + Math.sin(cam.pitch) * cam.dist, cam.look.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
    camera.lookAt(cam.look);
    sun.position.set(S.pos.x + 6, 12, S.pos.z + 5); sun.target.position.copy(S.pos);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__w = { S, camera, cam };
})();
</script>
</body>
</html>
