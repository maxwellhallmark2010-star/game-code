<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Drift GP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');
html,body{margin:0;height:100%;overflow:hidden;background:#9fd2ff;color:#fff;font-family:'Chakra Petch',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.7);font-weight:700}
#lap{top:12px;left:max(14px,env(safe-area-inset-left,0px));font-size:22px;line-height:1.3}
#lap small{display:block;font-size:14px;opacity:.85;font-weight:500}
#pos{font-size:44px;line-height:1;color:#ffd23f}#pos small{display:inline!important;font-size:20px;color:#fff}
#time{top:12px;left:50%;transform:translateX(-50%);font-size:30px;font-variant-numeric:tabular-nums;text-align:center}
#time small{display:block;font-size:14px;font-weight:500;opacity:.85}
#mini{position:fixed;top:12px;right:max(14px,env(safe-area-inset-right,0px));width:150px;height:150px;border-radius:12px;background:rgba(10,18,32,.55);border:2px solid rgba(255,255,255,.25)}
#spd{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:right;font-size:70px;line-height:.9;font-variant-numeric:tabular-nums}
#spd small{display:block;font-size:16px;font-weight:500;opacity:.8}
#rpm{width:210px;height:8px;background:rgba(255,255,255,.2);border-radius:5px;margin-top:8px;margin-left:auto;overflow:hidden}#rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cf,#ffd23f,#f33)}
#nit{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:14px;letter-spacing:.14em}
#nit div{width:200px;height:12px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}#nit i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#2b8cff,#7be0ff)}
#big{left:50%;top:32%;transform:translate(-50%,-50%);font-size:min(24vw,170px);color:#fff;text-align:center;opacity:0}
#big.pop{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#toast{left:50%;top:18%;transform:translateX(-50%);font-size:26px;opacity:0;transition:opacity .35s;text-align:center;color:#ffd23f}
#wrong{left:50%;top:26%;transform:translateX(-50%);font-size:34px;color:#ff4d4d;opacity:0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:linear-gradient(160deg,rgba(255,120,30,.88),rgba(180,20,90,.9) 60%,rgba(40,20,120,.92))}
.screen h1{margin:0;font-size:clamp(40px,10vw,88px);font-style:italic;letter-spacing:.03em;text-shadow:0 5px 0 #8a1a1a,0 10px 24px rgba(0,0,0,.4)}
.screen h2{margin:4px 0 12px;font-size:22px;font-weight:500;opacity:.92}
.opt{margin:8px 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.opt label{opacity:.85;margin-right:4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw[aria-pressed="true"]{border-color:#fff;transform:scale(1.15)}
.pill{font:700 15px 'Chakra Petch',sans-serif;color:#fff;background:rgba(0,0,0,.35);border:2px solid transparent;border-radius:20px;padding:7px 16px;cursor:pointer}.pill[aria-pressed="true"]{background:#fff;color:#a2145a}
.go{margin-top:16px;font:700 26px 'Chakra Petch',sans-serif;font-style:italic;color:#3a1c00;background:#ffd23f;border:0;border-radius:12px;padding:14px 46px;cursor:pointer;box-shadow:0 6px 0 #b8860b}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #b8860b}
.keys{margin-top:14px;font-size:13px;opacity:.85;max-width:560px;line-height:1.6}
.res{font-size:20px;line-height:1.7;font-variant-numeric:tabular-nums}
#touch{position:fixed;inset:auto 0 0 0;display:none;pointer-events:none}
.tb{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);color:#fff;font:700 24px 'Chakra Petch';pointer-events:auto;display:flex;align-items:center;justify-content:center}
.tb.on{background:rgba(255,255,255,.5)}
.hidden{display:none!important}
@media (max-width:640px){#mini{width:104px;height:104px}#spd{font-size:46px;bottom:calc(110px + env(safe-area-inset-bottom,0px))}#time{font-size:22px}#nit{bottom:calc(110px + env(safe-area-inset-bottom,0px))}}
</style>
</head><body>
<canvas id="gl"></canvas>
<div class="hud" id="lap"><div id="pos">1<small>st / 6</small></div><small id="lapn">Lap 1/3</small></div>
<div class="hud" id="time"><span id="t">0:00.00</span><small id="best">Best —</small></div>
<canvas id="mini" width="300" height="300"></canvas>
<div class="hud" id="spd"><span id="kmh">0</span><small>km/h · gear <b id="gear">1</b></small><div id="rpm"><i></i></div></div>
<div class="hud" id="nit">NITRO<div><i></i></div></div>
<div class="hud" id="big"></div><div class="hud" id="toast"></div><div class="hud" id="wrong">WRONG WAY</div>
<div id="touch">
 <div class="tb" id="tl" style="left:max(12px,env(safe-area-inset-left,0px))">◀</div><div class="tb" id="tr" style="left:calc(max(12px,env(safe-area-inset-left,0px)) + 90px)">▶</div>
 <div class="tb" id="tg" style="right:max(12px,env(safe-area-inset-right,0px))">GO</div><div class="tb" id="tbk" style="right:calc(max(12px,env(safe-area-inset-right,0px)) + 90px)">⏹</div>
 <div class="tb" id="tn" style="right:max(12px,env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px))">N₂O</div>
</div>
<div class="screen" id="menu"><h1>TURBO DRIFT GP</h1><h2>3 laps · 5 rivals · ramps · nitro</h2>
 <div class="opt"><label>Car</label><span id="cols"></span></div>
 <div class="opt"><label>Rivals</label><button class="pill" data-d="0" aria-pressed="false">Easy</button><button class="pill" data-d="1" aria-pressed="true">Normal</button><button class="pill" data-d="2" aria-pressed="false">Hard</button></div>
 <div class="opt"><label>Time</label><button class="pill" data-tm="0" aria-pressed="true">Day</button><button class="pill" data-tm="1" aria-pressed="false">Dusk</button></div>
 <button class="go" id="start">START RACE</button>
 <div class="keys">W / ↑ gas · S / ↓ brake &amp; reverse · A D / ← → steer · Space handbrake (drift!) · Shift nitro · R reset to track · C camera · T dusk · M mute</div></div>
<div class="screen hidden" id="end"><h1 id="etitle">FINISH!</h1><div class="res" id="eres"></div><button class="go" id="again">RACE AGAIN</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,$=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const LAPS=3,NR=5;

// ---------- renderer ----------
const renderer=new T.WebGLRenderer({canvas:$('gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const SKY={day:new T.Color(0x8fd0ff),dusk:new T.Color(0xff9a5c)};
scene.background=SKY.day.clone();scene.fog=new T.Fog(0x8fd0ff,120,900);
const camera=new T.PerspectiveCamera(62,1,.3,2500);
const hemi=new T.HemisphereLight(0xcfe8ff,0x5a7a3a,.75);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff3dc,1.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=10;sc.far=400;sun.shadow.bias=-.0005;
scene.add(sun,sun.target);
const headL=[-.7,.7].map(x=>{const s=new T.SpotLight(0xfff2cc,0,70,.5,.5,1.2);s.target.position.set(x*3,0,25);return s});

// ---------- helpers / textures ----------
function cTex(w,h,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t}
const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.05},o));
const grassTex=cTex(128,128,(x,w,h)=>{x.fillStyle='#3f7d33';x.fillRect(0,0,w,h);for(let i=0;i<1600;i++){x.fillStyle=`hsl(${85+Math.random()*30},${35+Math.random()*20}%,${24+Math.random()*16}%)`;x.fillRect(Math.random()*w,Math.random()*h,2,3)}},400,400);
const ground=new T.Mesh(new T.PlaneGeometry(5000,5000),new T.MeshStandardMaterial({map:grassTex,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ---------- track ----------
const CP=[[0,-200],[120,-215],[240,-150],[285,-40],[230,60],[135,95],[60,175],[-40,235],[-175,205],[-255,110],[-235,-20],[-145,-75],[-115,-150]];
const curve=new T.CatmullRomCurve3(CP.map(p=>new T.Vector3(p[0],0,p[1])),true,'centripetal');
const N=1400,HW=10,PT=curve.getSpacedPoints(N).slice(0,N);
const TL=curve.getLength(),DS=TL/N;
const TN=PT.map((p,i)=>{const a=PT[(i+N-1)%N],b=PT[(i+1)%N];return new T.Vector3(b.x-a.x,0,b.z-a.z).normalize()});
const SD=TN.map(t=>new T.Vector3(t.z,0,-t.x)); // right-hand side
const curveSpeed=PT.map((p,i)=>{const a=TN[i],b=TN[(i+10)%N];const ang=Math.acos(clamp(a.dot(b),-1,1));const k=ang/(10*DS);return clamp(Math.sqrt(30/Math.max(k,1e-4)),20,70)});
function ribbon(o0,o1,y,tex,mat){
  const pos=[],uv=[],idx=[],nor=[],cnt=Math.round(TL/18);
  for(let i=0;i<=N;i++){const p=PT[i%N],s=SD[i%N];pos.push(p.x+s.x*o0,y,p.z+s.z*o0,p.x+s.x*o1,y,p.z+s.z*o1);uv.push(0,i/N*cnt,1,i/N*cnt);nor.push(0,1,0,0,1,0);
    if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setAttribute('normal',new T.Float32BufferAttribute(nor,3));g.setIndex(idx);
  const m=new T.Mesh(g,mat);m.receiveShadow=true;scene.add(m);return m}
const roadTex=cTex(256,256,(x,w,h)=>{x.fillStyle='#3b3d42';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*.07})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}
  x.fillStyle='#ddd';x.fillRect(10,0,6,h);x.fillRect(w-16,0,6,h);x.fillStyle='#e8c33a';x.fillRect(w/2-3,0,6,h*.5)});
ribbon(-HW,HW,.05,roadTex,new T.MeshStandardMaterial({map:roadTex,roughness:.85,side:T.DoubleSide}));
const curbTex=cTex(32,64,(x,w,h)=>{x.fillStyle='#e23';x.fillRect(0,0,w,h/2);x.fillStyle='#fff';x.fillRect(0,h/2,w,h/2)});
const cm=new T.MeshStandardMaterial({map:curbTex,roughness:.8,side:T.DoubleSide});
ribbon(HW,HW+1.4,.07,curbTex,cm);ribbon(-HW-1.4,-HW,.07,curbTex,cm);
// nearest point on track
function nearest(x,z,hint){
  let best=1e9,bi=0;const lo=hint===undefined?0:-60,hi=hint===undefined?N-1:60;
  for(let k=lo;k<=hi;k++){const i=hint===undefined?k:(hint+k+N)%N,p=PT[i],dx=x-p.x,dz=z-p.z,d=dx*dx+dz*dz;if(d<best){best=d;bi=i}}
  const p=PT[bi],s=SD[bi];return {i:bi,d:Math.sqrt(best),lat:(x-p.x)*s.x+(z-p.z)*s.z}
}
// minimap base
const mm=$('mini'),mctx=mm.getContext('2d');
let mb={x0:1e9,x1:-1e9,z0:1e9,z1:-1e9};PT.forEach(p=>{mb.x0=Math.min(mb.x0,p.x);mb.x1=Math.max(mb.x1,p.x);mb.z0=Math.min(mb.z0,p.z);mb.z1=Math.max(mb.z1,p.z)});
const mS=Math.min(250/(mb.x1-mb.x0),250/(mb.z1-mb.z0)),mX=x=>25+(x-mb.x0)*mS,mZ=z=>25+(mb.z1-z)*mS;
const mbase=document.createElement('canvas');mbase.width=mbase.height=300;
(()=>{const c=mbase.getContext('2d');c.lineWidth=11;c.strokeStyle='#d8dde6';c.lineJoin='round';c.beginPath();PT.forEach((p,i)=>i?c.lineTo(mX(p.x),mZ(p.z)):c.moveTo(mX(p.x),mZ(p.z)));c.closePath();c.stroke();c.lineWidth=7;c.strokeStyle='#394050';c.stroke();})();

// ---------- gates ----------
const gates=[];
function bannerTex(t,fin){return cTex(256,64,(x,w,h)=>{if(fin){for(let i=0;i<16;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?'#fff':'#111';x.fillRect(i*16,j*16,16,16)}x.fillStyle='rgba(0,0,0,.6)';x.fillRect(40,12,176,40);x.fillStyle='#fff';x.font='bold 30px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,33)}else{x.fillStyle='#ffb400';x.fillRect(0,0,w,h);x.fillStyle='#222';x.font='bold 34px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,34)}})}
const cpIdx=[];for(let k=0;k<8;k++)cpIdx.push(Math.floor(k*N/8));
cpIdx.forEach((ix,k)=>{
  const g=new T.Group(),p=PT[ix],t=TN[ix];g.position.set(p.x,0,p.z);g.rotation.y=Math.atan2(t.x,t.z);scene.add(g);
  const w=HW+2,pm=M(k?0x555a66:0x222222,{metalness:.4});
  for(const s of[-1,1]){const c=new T.Mesh(new T.CylinderGeometry(.35,.45,9,10),pm);c.position.set(s*w,4.5,0);c.castShadow=true;g.add(c)}
  const mat=new T.MeshBasicMaterial({map:bannerTex(k?'CHECKPOINT '+k:'START / FINISH',k===0),side:T.DoubleSide});
  const b=new T.Mesh(new T.PlaneGeometry(w*2,k?2.4:3),mat);b.position.set(0,8.2,0);b.rotation.y=Math.PI;g.add(b);
  gates.push({g,mat,k});
});
// ---------- ramps ----------
const ramps=[];
[[200,.0],[610,-3],[980,3],[1250,0]].forEach(([ix,lat])=>{
  const p=PT[ix],t=TN[ix],s=SD[ix],L=12,H=2.6;
  const g=new T.Group();g.position.set(p.x+s.x*lat,0,p.z+s.z*lat);g.rotation.y=Math.atan2(t.x,t.z);scene.add(g);
  const slabTex=cTex(64,64,(x,w,h)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#111':'#ffc400';x.fillRect(0,i*8,w,8)}});
  const ang=Math.atan2(H,L),len=Math.hypot(H,L);
  const slab=new T.Mesh(new T.BoxGeometry(8,.4,len),M(0xffffff,{map:slabTex,roughness:.6}));slab.position.set(0,H/2,L/2);slab.rotation.x=-ang;slab.castShadow=slab.receiveShadow=true;g.add(slab);
  const sideM=M(0x8a8f99);for(const sx of[-1,1]){const sd=new T.Mesh(new T.CylinderGeometry(.18,.18,H,6),sideM);sd.position.set(sx*3.9,H/2-.1,L-.2);g.add(sd)}
  ramps.push({x:g.position.x,z:g.position.z,yaw:g.rotation.y,L,H,hw:4,
    to(px,pz){const dx=px-this.x,dz=pz-this.z,c=Math.cos(this.yaw),s=Math.sin(this.yaw);return{lz:dx*c-dz*s,lx:dx*s+dz*c}}});
});
// ---------- scenery ----------
const obst=[]; // [x,z,r]
const trackDist=(x,z)=>{let b=1e9;for(let i=0;i<N;i+=5){const p=PT[i],d=(x-p.x)**2+(z-p.z)**2;if(d<b)b=d}return Math.sqrt(b)};
function inPoly(x,z){let c=false;for(let i=0,j=N-1;i<N;j=i++){const a=PT[i],b=PT[j];if((a.z>z)!==(b.z>z)&&x<(b.x-a.x)*(z-a.z)/(b.z-a.z)+a.x)c=!c}return c}
(function(){
  const nT=420,trunk=new T.InstancedMesh(new T.CylinderGeometry(.35,.5,3,6),M(0x6f4e37),nT),c1=new T.InstancedMesh(new T.ConeGeometry(2.6,5,8),M(0x2f7d4a),nT),c2=new T.InstancedMesh(new T.ConeGeometry(2,4,8),M(0x3f9a5a),nT),d=new T.Object3D();
  let n=0,tries=0;
  while(n<nT&&tries<6000){tries++;const x=rnd(-520,520),z=rnd(-480,480);if(trackDist(x,z)<HW+9)continue;if(inPoly(x,z)&&Math.hypot(x*.9,z)<150&&Math.random()<.9)continue;
    const s=rnd(.8,1.7);d.position.set(x,1.5*s,z);d.scale.setScalar(s);d.rotation.y=Math.random()*6;d.updateMatrix();trunk.setMatrixAt(n,d.matrix);
    d.position.y=4.8*s;d.updateMatrix();c1.setMatrixAt(n,d.matrix);d.position.y=7.4*s;d.updateMatrix();c2.setMatrixAt(n,d.matrix);obst.push([x,z,.7*s]);n++}
  trunk.count=c1.count=c2.count=n;[trunk,c1,c2].forEach(m=>{m.castShadow=true;scene.add(m)});
})();
// city blocks inside the loop
(function(){
  const variants=[[16,30],[18,46],[14,64],[20,80]],dd=new T.Object3D();
  variants.forEach(([w,h],vi)=>{
    const tex=cTex(128,256,(x,ww,hh)=>{x.fillStyle=['#5b6573','#7b6f66','#4d5a66','#69707c'][vi];x.fillRect(0,0,ww,hh);for(let j=0;j<16;j++)for(let i=0;i<6;i++){x.fillStyle=Math.random()<.35?'#ffe9a8':'#1c2733';x.fillRect(8+i*20,10+j*15,12,9)}},1,1);
    const pos=[];
    for(let k=0;k<60;k++){const x=rnd(-180,150),z=rnd(-120,150);if(!inPoly(x,z)||trackDist(x,z)<HW+w*.8+10)continue;if(pos.some(q=>Math.hypot(q[0]-x,q[1]-z)<w*1.7))continue;if(obst.some(o=>o[2]>3&&Math.hypot(o[0]-x,o[1]-z)<w*1.5))continue;pos.push([x,z]);if(pos.length>=7)break}
    const m=new T.InstancedMesh(new T.BoxGeometry(w,h,w),new T.MeshStandardMaterial({map:tex,roughness:.8}),pos.length||1);
    pos.forEach(([x,z],i)=>{dd.position.set(x,h/2,z);dd.rotation.set(0,0,0);dd.scale.set(1,1,1);dd.updateMatrix();m.setMatrixAt(i,dd.matrix);obst.push([x,z,w*.75])});
    m.count=pos.length;m.castShadow=m.receiveShadow=true;scene.add(m);
  });
})();
// mountains
for(let i=0;i<22;i++){const a=i/22*Math.PI*2,r=900+rnd(0,200),h=rnd(140,320);const m=new T.Mesh(new T.ConeGeometry(rnd(120,220),h,6),M(i%3?0x58708f:0x6a7f9c,{flatShading:true,fog:true}));m.position.set(Math.cos(a)*r,h/2-5,Math.sin(a)*r);m.rotation.y=Math.random()*3;scene.add(m)}
// billboards
const ads=['TURBO COLA','NITRO FUEL','FUNLAND','SPEED KING','DRIFT CO.','GO GO GO'];
for(let i=0;i<ads.length;i++){
  const ix=Math.floor((i+.5)*N/ads.length)+40,p=PT[ix],s=SD[ix],side=i%2?1:-1,off=(HW+9)*side;
  const g=new T.Group();g.position.set(p.x+s.x*off,0,p.z+s.z*off);g.rotation.y=Math.atan2(-s.x*side,-s.z*side);scene.add(g);
  const tx=cTex(256,128,(x,w,h)=>{x.fillStyle=['#e63946','#1d6fe0','#ffb703','#2a9d8f','#9d4edd','#ff7b00'][i];x.fillRect(0,0,w,h);x.fillStyle='#fff';x.font='bold 36px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ads[i],w/2,h/2)});
  const b=new T.Mesh(new T.BoxGeometry(14,6,.4),new T.MeshBasicMaterial({map:tx}));b.position.y=7;g.add(b);
  for(const x of[-5,5]){const c=new T.Mesh(new T.CylinderGeometry(.3,.3,5,6),M(0x555555));c.position.set(x,2.5,0);g.add(c)}
  obst.push([g.position.x,g.position.z,3]);
}

// ---------- car model ----------
const CARCOLS=[0xe63946,0x2b8cff,0xffc400,0x2fd27a,0xb04bff,0xffffff];
function buildCar(col){

    if(car.y<=0){car.y=0;car.air=false;const imp=Math.abs(car.vy);car.vy=0;car.shake=Math.min(.6,imp*.04);thud(clamp(imp*.05,.1,.6));for(let k=0;k<6;k++)puff(car.x+rnd(-1,1),.3,car.z+rnd(-1,1),0xcccccc,2.4,.8,rnd(-2,2),1.5,rnd(-2,2));vf*=.92;car.vx*=.92;car.vz*=.92}}

function stepRivals(dt){
  const dfac=[.88,.95,1.03][race.diff];

    if(race.state!=='race'&&race.state!=='finished'){r.v=0}
    else{

      if(r.fin)target=Math.min(target,35);
      if(r.slow>0){r.slow-=dt;target*=.7}
      r.v+=clamp(target-r.v,-30*dt,20*dt);
      r.s+=r.v*dt/DS;
      if(r.s>=N){r.s-=N;if(!r.started)r.started=true;else{r.lap++;if(r.lap>LAPS&&!r.fin){r.fin=true;r.finT=race.t}}}

    r.x=lerp(p0.x,p1.x,f)+s0.x*r.lane;r.z=lerp(p0.z,p1.z,f)+s0.z*r.lane;r.yaw=Math.atan2(t0.x,t0.z);

    const g=r.m.g;let y=0;for(const rp of ramps){const q=rp.to(r.x,r.z);if(Math.abs(q.lz)<rp.hw&&q.lx>-2&&q.lx<rp.L+14){y=q.lx<rp.L?rp.H*Math.max(0,q.lx)/rp.L:Math.max(0,rp.H*1.2*Math.sin(clamp((q.lx-rp.L)/14,0,1)*Math.PI))}}

}
const playerProg=()=>race.startedLine?(race.lap-1)*N+car.idx:car.idx-N;
const rivalProg=r=>r.started?(r.lap-1)*N+r.s:r.s-N;
function standings(){const list=[{me:true,p:race.finished?1e9-race.finT:playerProg()}];rivals.forEach(r=>list.push({me:false,p:r.fin?1e9-r.finT:rivalProg(r)}));list.sort((a,b)=>b.p-a.p);return list.findIndex(x=>x.me)+1}

// ---------- race logic ----------
function raceLogic(dt){
  if(race.state==='countdown'){
    const prev=Math.ceil(race.countdown);race.countdown-=dt;const cur=Math.ceil(race.countdown);
    if(race.countdown<=.6&&prev>cur||cur!==prev){}
    if(cur!==prev&&cur>=1&&cur<=3){big(String(cur));beep(440,.2,.18)}
    if(race.countdown<=0){race.state='race';race.t=0;big('GO!');beep(880,.5,.2);toast('Go! Pass every checkpoint')}
    return;
  }
  if(race.state!=='race'&&race.state!=='finished')return;
  if(race.state==='race')race.t+=dt;else race.finT2=(race.finT2||0)+dt;
  // line crossing
  if(!race.startedLine&&car.prevIdx>N*.75&&car.idx<N*.25)race.startedLine=true;
  if(race.state==='race'){
    const target=cpIdx[race.cpNext%8];let d=Math.abs(car.idx-target);d=Math.min(d,N-d);
    if(d<22&&Math.abs(car.lat)<HW+14){
      const k=race.cpNext%8;gates[k].mat.color.set(0x66ff88);beep(1100,.12,.12,'triangle');race.lastCp=cpIdx[k];
      if(k===0){ // lap complete
        if(race.startedLine){const lt=race.t-race.lapStart;race.lapTimes.push(lt);race.lapStart=race.t;let nb=false;if(!bestLap||lt<bestLap){bestLap=lt;nb=true;try{localStorage.setItem('tdgp_best',lt)}catch(e){}}
          race.lap++;toast(`Lap ${race.lapTimes.length}: ${fmt(lt)}${nb?'  NEW BEST!':''}`,2400);gates.forEach((g,i)=>{if(i)g.mat.color.set(0xffffff)});
          if(race.lap>LAPS)finish();}
        race.cpNext=1;
      }else{race.cpNext=k+1;if(race.cpNext===8)race.cpNext=0;toast(k===7?'Final checkpoint! Cross the line':`Checkpoint ${k}/7`,900)}
    }
    // wrong way
    const tn=TN[car.idx],vf=car.vx*tn.x+car.vz*tn.z;
    race.wrong=vf<-4?race.wrong+dt:0;$('wrong').style.opacity=race.wrong>1.5?1:0;
  }
}
function finish(){
  race.finished=true;race.state='finished';race.finT=race.t;
  const place=standings();
  const sfx=['','st','nd','rd'][place]||'th';
  $('etitle').textContent=place===1?'YOU WIN!':place<=3?'PODIUM!':'FINISHED';
  $('eres').innerHTML=`Position: <b>${place}${sfx} of ${NR+1}</b><br>Total time: <b>${fmt(race.t)}</b><br>${race.lapTimes.map((t,i)=>`Lap ${i+1}: ${fmt(t)}`).join('<br>')}<br>Best lap ever: <b>${fmt(bestLap)}</b>`;
  setTimeout(()=>$('end').classList.remove('hidden'),1600);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.3,.15,'triangle'),i*160));
}

// ---------- camera ----------
let camYaw=0,fovCur=62;const camPos=new T.Vector3(),camLook=new T.Vector3();
function updateCamera(dt,info){
  const sp=info.sp;
  const target=sp>6?Math.atan2(car.vx,car.vz):car.yaw;
  let d=target-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));
  const blend=camMode===1?1:.45;const tY=car.yaw+(d*0+Math.atan2(Math.sin(target-car.yaw),Math.cos(target-car.yaw)))*(1-blend)*0+0;
  let dd=car.yaw-camYaw;dd=Math.atan2(Math.sin(dd),Math.cos(dd));camYaw+=dd*Math.min(1,dt*(camMode===1?20:5));
  const f=new T.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
  let wantFov=62+clamp(sp/60,0,1)*16+(car.boosting?10:0);
  let pos,look;
  if(camMode===1){pos=new T.Vector3(car.x+f.x*.9,car.y+1.25,car.z+f.z*.9);look=pos.clone().addScaledVector(f,10).add(new T.Vector3(0,-.1,0));wantFov+=6}
  else{const dist=camMode===2?12:7.6,h=camMode===2?5.5:3.1;pos=new T.Vector3(car.x-f.x*(dist+sp*.02),car.y+h,car.z-f.z*(dist+sp*.02));look=new T.Vector3(car.x+f.x*6,car.y+1.3,car.z+f.z*6)}
  camPos.lerp(pos,camMode===1?1:1-Math.exp(-dt*12));camLook.lerp(look,1-Math.exp(-dt*16));
  car.shake=Math.max(0,car.shake-dt*1.6);
  const sh=car.shake*.35+(car.boosting?.03:0);
  camera.position.set(camPos.x+rnd(-sh,sh),camPos.y+rnd(-sh,sh),camPos.z+rnd(-sh,sh));camera.lookAt(camLook);
  fovCur+=(wantFov-fovCur)*Math.min(1,dt*5);camera.fov=fovCur;camera.updateProjectionMatrix();
  sun.position.set(car.x+60,120,car.z+40);sun.target.position.set(car.x,0,car.z);
}
// ---------- audio update ----------
let gear=1;
function updateAudio(info){
  if(!AC)return;const sp=info.sp,gs=[0,16,28,40,52,70];
  let g=1;for(let i=1;i<gs.length;i++)if(sp>=gs[i])g=i+1;g=Math.min(g,5);
  const lo=gs[g-1],hi=gs[g],rpm=clamp((sp-lo)/(hi-lo),0,1)*.75+.25+(info.gas?.0:-.1);
  gear=g;const t=AC.currentTime;
  const fr=55+rpm*130*(race.state==='countdown'&&info.gas?1.6:1);eng1.frequency.setTargetAtTime(fr,t,.05);eng2.frequency.setTargetAtTime(fr*.5,t,.05);
  engF.frequency.setTargetAtTime(500+rpm*900+(info.gas?400:0),t,.08);
  engG.gain.setTargetAtTime(muted?0:(info.gas?.13:.07)*(car.boosting?1.4:1),t,.08);
  skG.gain.setTargetAtTime(muted?0:car.drifting?clamp((car.slip-3)*.025,0,.14):0,t,.05);
  windG.gain.setTargetAtTime(muted?0:clamp(sp/70,0,1)*.09,t,.1);
  return rpm;
}
// ---------- loop ----------
let last=performance.now(),info={sp:0,gas:0};
const smokeUp=new T.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(race.state==='menu'){
    // attract camera: orbit the start area
    const a=now*.0002;camera.position.set(Math.sin(a)*60,22,-200+Math.cos(a)*60+0);camera.lookAt(0,2,-200);
    renderer.render(scene,camera);return}
  if(race.state!=='menu'){
    const sub=2;for(let i=0;i<sub;i++)info=stepCar(dt/sub);
    raceLogic(dt);stepRivals(dt);
  }
  // models
  const m=car.model;
  if(m){m.g.position.set(car.x,car.y,car.z);m.g.rotation.set(car.pitch,car.yaw,car.roll,'YXZ');
    const spin=info.vf*dt/.39;m.wheels.forEach(w=>w.rotation.x+=spin);m.fronts.forEach(w=>w.rotation.y=car.steer*1.1);
    m.flame.visible=car.boosting;if(car.boosting){m.flame.scale.set(1,.8+Math.random()*.5,1);puff(car.x-Math.sin(car.yaw)*3.4,car.y+.6,car.z-Math.cos(car.yaw)*3.4,0x77ccff,1,.25,0,0,0)}
    m.tl.color.set(info.gas===0&&(keys.KeyS||keys.ArrowDown||touch.b)?0xff2222:0x661111);
    headL.forEach((h,i)=>{const s=i?1:-1;h.position.set(car.x+Math.cos(car.yaw)*s*.65+Math.sin(car.yaw)*2,car.y+.7,car.z-Math.sin(car.yaw)*s*.65+Math.cos(car.yaw)*2);h.target.position.set(car.x+Math.sin(car.yaw)*30,0,car.z+Math.cos(car.yaw)*30)})}
  // smoke
  for(const p of smoke){if(p.life>0){p.life-=dt;const k=1-p.life/p.max;p.s.position.x+=p.vx*dt;p.s.position.y+=p.vy*dt;p.s.position.z+=p.vz*dt;p.s.scale.setScalar(p.size*(1+k*1.6));p.s.material.opacity=.55*(1-k);if(p.life<=0)p.s.visible=false}}
  pickups.forEach(p=>{p.g.rotation.y+=dt*2;p.g.position.y=1.2+Math.sin(now*.003+p.x)*.2});
  updateCamera(dt,info);
  const rpm=updateAudio(info)||0;
  // hud
  const kmh=Math.round(info.sp*3.6*(race.state==='menu'?0:1)*1.0);
  $('kmh').textContent=kmh;$('gear').textContent=gear;$('rpm').firstElementChild.style.width=(rpm*100)+'%';
  $('nit').lastElementChild.firstElementChild.style.width=car.nitro+'%';
  const place=standings();$('pos').innerHTML=place+`<small>${['','st','nd','rd'][place]||'th'} / ${NR+1}</small>`;
  $('lapn').textContent=`Lap ${Math.min(race.lap,LAPS)}/${LAPS}`;
  $('t').textContent=fmt(race.state==='countdown'?0:race.t);
  $('best').textContent=bestLap?'Best lap '+fmt(bestLap):'Best —';
  // minimap
  mctx.clearRect(0,0,300,300);mctx.drawImage(mbase,0,0);
  rivals.forEach((r,i)=>{mctx.fillStyle=['#ff7b00','#00c2a8','#ff3d7f','#8338ec','#3a86ff'][i];mctx.beginPath();mctx.arc(mX(r.x),mZ(r.z),7,0,7);mctx.fill()});
  mctx.save();mctx.translate(mX(car.x),mZ(car.z));mctx.rotate(-car.yaw+Math.PI);mctx.fillStyle='#fff';mctx.strokeStyle='#e63946';mctx.lineWidth=3;mctx.beginPath();mctx.moveTo(0,-11);mctx.lineTo(8,9);mctx.lineTo(-8,9);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();
  renderer.render(scene,camera);
}
// initial state: place a car for the attract screen
race.state='menu';
(function(){const st=placeOnTrack(N-34,3.5);car.x=st.x;car.z=st.z;car.yaw=st.yaw;car.model=buildCar(CARCOLS[0]);scene.add(car.model.g);setupRivals();rivals.forEach(r=>{const i0=Math.floor(r.s)%N,p=placeOnTrack(i0,r.lane);r.x=p.x;r.z=p.z;r.yaw=p.yaw;r.m.g.position.set(p.x,0,p.z);r.m.g.rotation.y=p.yaw});
  car.model.g.position.set(car.x,0,car.z);car.model.g.rotation.y=car.yaw;camPos.set(car.x,5,car.z-8);camLook.set(car.x,1,car.z)})();
requestAnimationFrame(frame);
window.__car={car,race,rivals,keys,PT,N,begin,get info(){return info},tp:i=>{const p=placeOnTrack(i,0);car.x=p.x;car.z=p.z;car.yaw=p.yaw;car.idx=i;car.prevIdx=i;car.vx=Math.sin(p.yaw)*40;car.vz=Math.cos(p.yaw)*40}};
})();
</script>
