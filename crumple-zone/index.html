<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crumple Zone</title>
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D proving ground; instrument cluster top-left, actions top-right, controls along the bottom. */
:root {
  color-scheme: dark;
  --sky: #bcd3e6;
  --panel: rgba(18, 22, 28, 0.78);
  --panel-edge: rgba(255, 255, 255, 0.14);
  --ink: #f3f1ea;
  --ink-dim: #a9b0b8;
  --hazard: #ffc21a;
  --hazard-ink: #1b1608;
  --danger: #ff5a3c;
  --display: "Saira Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Saira", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#game { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#c { display: block; width: 100%; height: 100%; cursor: grab; }
#c.dragging { cursor: grabbing; }

.cluster, .actions, .legend, .pads { position: absolute; z-index: 2; }
.cluster {
  top: 16px; left: 16px; min-width: 168px;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px;
  padding: 10px 14px 12px; display: grid; gap: 6px;
}
.mark { font: 700 12px/1 var(--display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--hazard); }
.speed { display: flex; align-items: baseline; gap: 8px; }
.speed b { font: 700 54px/0.9 var(--display); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
.speed span { font: 500 13px/1.2 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.dmg-row { display: flex; justify-content: space-between; font: 500 12px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
.dmg-row output { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: rgba(255,255,255,0.12); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: var(--hazard); transition: width 0.15s linear, background 0.3s; }
.bar i.bad { background: var(--danger); }
.slow { font: 700 12px/1 var(--display); letter-spacing: 0.2em; color: var(--hazard-ink); background: var(--hazard); padding: 4px 6px; border-radius: 2px; justify-self: start; }

.actions { top: 16px; right: 16px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - 220px); }
button {
  font: 500 14px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px;
  padding: 10px 12px; cursor: pointer; touch-action: none;
}
button kbd { font: inherit; color: var(--hazard); margin-left: 6px; }
button:hover { border-color: var(--hazard); }
button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
button.on { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }

.legend {
  left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px;
  padding: 8px 14px; font-size: 13px; color: var(--ink-dim); white-space: nowrap;
}
.legend kbd { font: 700 13px/1 var(--display); letter-spacing: 0.08em; color: var(--ink); }

.pads { left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: none; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.pads div { display: flex; gap: 10px; pointer-events: auto; }
.pads button { width: 68px; height: 68px; padding: 0; font-size: 15px; border-radius: 50%; }
.pads button.gas { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); width: 78px; height: 78px; }
.pads button.held { filter: brightness(1.5); }
@media (pointer: coarse) {
  .pads { display: flex; }
  .legend { display: none; }
  button kbd { display: none; }
}
@media (max-width: 520px) {
  .speed b { font-size: 42px; }
  .cluster { min-width: 132px; padding: 8px 10px 10px; }
  .actions { max-width: calc(100% - 176px); gap: 6px; }
  .actions button { padding: 9px 9px; font-size: 13px; }
}
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; background: #12161c; color: var(--ink); z-index: 5; }
</style>

<div id="game">
  <canvas id="c"></canvas>

  <div class="cluster">
    <div class="mark">Crumple Zone</div>
    <div class="speed"><b id="spd">0</b><span>km/h<br><span id="mph">0 mph</span></span></div>
    <div class="dmg-row"><span>Damage</span><output id="dmgTxt">0%</output></div>
    <div class="bar"><i id="dmgBar"></i></div>
    <div class="slow" id="slowTag" hidden>Slow motion</div>
  </div>

  <div class="actions">
    <button id="bReset" type="button">Repair<kbd>R</kbd></button>
    <button id="bFlip" type="button">Flip upright<kbd>F</kbd></button>
    <button id="bSlow" type="button">Slow-mo<kbd>T</kbd></button>
    <button id="bCam" type="button">Chase cam<kbd>C</kbd></button>
  </div>

  <div class="legend"><kbd>W A S D</kbd> or arrows to drive &nbsp;·&nbsp; <kbd>Space</kbd> handbrake &nbsp;·&nbsp; <kbd>C</kbd> camera &nbsp;·&nbsp; drag to look, scroll or pinch to zoom</div>

  <div class="pads">
    <div>
      <button id="pL" type="button" aria-label="Steer left">◀</button>
      <button id="pR" type="button" aria-label="Steer right">▶</button>
    </div>
    <div>
      <button id="pB" type="button" aria-label="Brake or reverse">Brake</button>
      <button id="pG" type="button" class="gas" aria-label="Accelerate">Gas</button>
    </div>
  </div>
</div>

  wheelGeo.setAttribute('color', new THREE.BufferAttribute(Float32Array.from(CAR.wheel.c, v => v / 255), 3));
  wheelGeo.setIndex(CAR.wheel.i);
  const wheelMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide, shininess: 15 });
  const wheelMeshes = Phys.wheels.map(() => {
    const grp = new THREE.Group(), spin = new THREE.Group(), m = new THREE.Mesh(wheelGeo, wheelMat);
    m.castShadow = true; spin.add(m); grp.add(spin);
    grp.matrixAutoUpdate = false; grp.userData.spin = spin; scene.add(grp);
    return grp;
  });

  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  function syncMeshes() {
    const { px, py, pz, cf, cr, cu } = Phys;
    Phys.updateNodeDamage(); body.update(); glass.update(); skinPoint(eyeBind, 0, eye);
    Phys.wheels.forEach((w, k) => {
      const m = w.node, off = Phys.DROOP - w.comp - Phys.WR, st = w.front ? Phys.state.steer : 0, cs = Math.cos(st), sn = Math.sin(st);
      const side = k % 2 ? 1 : -1, out = side * -0.09;
      vA.set(cr[0] * cs - cf[0] * sn, cr[1] * cs - cf[1] * sn, cr[2] * cs - cf[2] * sn).multiplyScalar(side);
      vB.set(cu[0], cu[1], cu[2]);
      vC.set(cf[0] * cs + cr[0] * sn, cf[1] * cs + cr[1] * sn, cf[2] * cs + cr[2] * sn);
      const g = wheelMeshes[k];
      g.matrix.makeBasis(vA, vB, vC).setPosition(px[m] - cu[0] * off + cr[0] * out, py[m] - cu[1] * off + cr[1] * out, pz[m] - cu[2] * off + cr[2] * out);
      g.userData.spin.rotation.x = w.spin * side;
    });
  }

  // ---- input
  const keys = {}, pad = { l: 0, r: 0, g: 0, b: 0 };
  let camMode = 0, timeScale = 1;
  const $ = id => document.getElementById(id);
  const actions = {
    reset: () => Phys.reset(),
    flip: () => Phys.flip(),
    slow: () => { timeScale = timeScale === 1 ? 0.25 : 1; $('bSlow').classList.toggle('on', timeScale !== 1); $('slowTag').hidden = timeScale === 1; },
    cam: () => {
      camMode = (camMode + 1) % 4;
      $('bCam').firstChild.textContent = ['Chase cam', 'Driver cam', 'Far cam', 'Roof cam'][camMode];
      camera.near = camMode === 1 ? 0.05 : 0.3;
      view.lookYaw = view.lookPitch = 0; applyFov();
    }
  };
  const keyMap = { KeyR: 'reset', KeyF: 'flip', KeyT: 'slow', KeyC: 'cam' };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (!e.repeat && keyMap[e.code]) actions[keyMap[e.code]]();
    keys[e.code] = true;
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  [['bReset', 'reset'], ['bFlip', 'flip'], ['bSlow', 'slow'], ['bCam', 'cam']].forEach(([id, a]) =>
    $(id).addEventListener('click', e => { actions[a](); e.currentTarget.blur(); }));
  [['pL', 'l'], ['pR', 'r'], ['pG', 'g'], ['pB', 'b']].forEach(([id, k]) => {
    const el = $(id), set = v => e => { e.preventDefault(); pad[k] = v; el.classList.toggle('held', !!v); };
    el.addEventListener('pointerdown', e => { try { el.setPointerCapture(e.pointerId); } catch (_) {} set(1)(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, set(0)));
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
  function readInput() {
    const up = keys.KeyW || keys.ArrowUp || pad.g, dn = keys.KeyS || keys.ArrowDown || pad.b;
    const lf = keys.KeyA || keys.ArrowLeft || pad.l, rt = keys.KeyD || keys.ArrowRight || pad.r;
    Phys.input.thr = (up ? 1 : 0) - (dn ? 1 : 0);
    Phys.input.steer = (lf ? 1 : 0) - (rt ? 1 : 0); // +x is screen-left from behind the car
    Phys.input.hb = !!keys.Space;
  }

  // ---- camera: drag to look around, scroll or pinch to zoom
  const view = { yaw: 0, pitch: 0, zoom: 1, lookYaw: 0, lookPitch: 0, fpZoom: 1, lastDrag: -1e9 };
  const seat = () => camMode === 1 || camMode === 3;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const touches = new Map();
  let pinch = 0;
  function zoomBy(f) {
    if (seat()) { view.fpZoom = clamp(view.fpZoom * f, 0.4, 1.5); applyFov(); }
    else view.zoom = clamp(view.zoom * f, 0.28, 3.5);
    view.lastDrag = performance.now();
  }
  canvas.addEventListener('pointerdown', e => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0;
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    const t = touches.get(e.pointerId);
    if (!t) return;
    const dx = e.clientX - t.x, dy = e.clientY - t.y;
    t.x = e.clientX; t.y = e.clientY;
    view.lastDrag = performance.now();
    if (touches.size >= 2) { // two fingers: spread to zoom in, pinch to zoom out
      const [a, b] = [...touches.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch > 0 && d > 0) zoomBy(pinch / d);
      pinch = d;
      return;
    }
    const k = 0.0055;
    if (seat()) { view.lookYaw = clamp(view.lookYaw + dx * k, -2.6, 2.6); view.lookPitch = clamp(view.lookPitch + dy * k, -1.1, 1.1); }
    else { view.yaw -= dx * k; view.pitch = clamp(view.pitch + dy * k, -0.45, 1.1); }
  });
  const drop = e => { touches.delete(e.pointerId); pinch = 0; if (!touches.size) canvas.classList.remove('dragging'); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => canvas.addEventListener(n, drop));
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(clamp(e.deltaY, -120, 120) * (e.ctrlKey ? 0.012 : 0.0022))); }, { passive: false });
  canvas.addEventListener('dblclick', () => { view.yaw = view.pitch = view.lookYaw = view.lookPitch = 0; view.zoom = view.fpZoom = 1; applyFov(); });

  const camDir = new THREE.Vector3(0, 0, 1), camPos = new THREE.Vector3(0, 4, -9), look = new THREE.Vector3();
  function updateCamera(dt, snap) {
    const { c, cf, cr, cu } = Phys, now = performance.now(), held = touches.size > 0;
    // once you are driving again and have let go, the view drifts back behind the car (zoom stays where you left it)
    if (!held && now - view.lastDrag > 1500 && (Phys.input.thr || Phys.input.steer)) {
      const k = Math.min(1, dt * 2.5);
      view.yaw = Math.atan2(Math.sin(view.yaw), Math.cos(view.yaw)) * (1 - k); view.pitch *= 1 - k;
      view.lookYaw *= 1 - k; view.lookPitch *= 1 - k;
    }
    if (seat()) { // driver's seat, or on the roof
      const drv = camMode === 1;
      if (drv) camera.position.set(eye[0], eye[1], eye[2]);
      else camera.position.set(c[0] + cu[0] * 1.3 - cf[0] * 0.3, c[1] + cu[1] * 1.3 - cf[1] * 0.3, c[2] + cu[2] * 1.3 - cf[2] * 0.3);
      camera.up.set(cu[0], cu[1], cu[2]);
      const p = view.lookPitch - (drv ? 0.06 : 0.1), cy = Math.cos(view.lookYaw) * Math.cos(p), sy = Math.sin(view.lookYaw) * Math.cos(p), sp = Math.sin(p);
      camera.lookAt(camera.position.x + cf[0] * cy + cr[0] * sy + cu[0] * sp, camera.position.y + cf[1] * cy + cr[1] * sy + cu[1] * sp, camera.position.z + cf[2] * cy + cr[2] * sy + cu[2] * sp);
      camPos.copy(camera.position);
      return;
    }
    const fl = Math.hypot(cf[0], cf[2]);
    if (fl > 0.3) { vA.set(cf[0] / fl, 0, cf[2] / fl); camDir.lerp(vA, snap ? 1 : Math.min(1, dt * 3.5)).normalize(); }
    const dist = (camMode ? 16.3 : 8) * view.zoom, pitch = clamp(0.4 + view.pitch, -0.05, 1.5);
    const cs = Math.cos(view.yaw), sn = Math.sin(view.yaw), dx = camDir.x * cs + camDir.z * sn, dz = camDir.z * cs - camDir.x * sn;
    const ty = c[1] + 0.3;
    vB.set(c[0] - dx * dist * Math.cos(pitch), ty + dist * Math.sin(pitch), c[2] - dz * dist * Math.cos(pitch));
    camPos.lerp(vB, snap ? 1 : Math.min(1, dt * (held || now - view.lastDrag < 400 ? 18 : 6)));
    const floor = Phys.H(camPos.x, camPos.z) + 0.35;
    if (camPos.y < floor) camPos.y = floor;
    camera.position.copy(camPos); camera.up.set(0, 1, 0);
    look.set(c[0], ty + Math.min(0.6, dist * 0.075), c[2]); camera.lookAt(look);
  }

  function applyFov() {
    const base = host.clientWidth < host.clientHeight ? 78 : 62;
    camera.fov = seat() ? clamp(base * view.fpZoom, 22, 95) : base;
    camera.updateProjectionMatrix();
  }
  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h);
    applyFov();
  }
  addEventListener('resize', resize); resize();

  const spdEl = $('spd'), mphEl = $('mph'), dmgTxt = $('dmgTxt'), dmgBar = $('dmgBar');
  let last = performance.now(), acc = 0, tick = 0, first = true;
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    readInput();
    acc += dt * timeScale;
    let n = 0;
    while (acc >= Phys.DT && n < 16) { Phys.step(); acc -= Phys.DT; n++; }
    if (n === 16) acc = 0;
    syncMeshes();
    updateCamera(dt, first); first = false;
    const c = Phys.c;
    sun.position.set(c[0] + 60, c[1] + 95, c[2] + 35); sun.target.position.set(c[0], c[1], c[2]);
    if (++tick % 6 === 0) {
      const k = Math.abs(Phys.state.speed) * 3.6, d = Math.round(Phys.measureDamage() * 100);
      spdEl.textContent = Math.round(k); mphEl.textContent = Math.round(k * 0.6214) + ' mph';
      dmgTxt.textContent = d + '%'; dmgBar.style.width = d + '%'; dmgBar.classList.toggle('bad', d >= 60);
    }
    if (c[1] < -80 || !isFinite(c[1])) Phys.reset();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
