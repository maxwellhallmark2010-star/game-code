<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Maze</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1a; font-family: system-ui, sans-serif; color: #e8f0ff; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; gap: 20px; font-size: 18px; letter-spacing: .05em;
         text-shadow: 0 0 8px #000; pointer-events: none; flex-wrap: wrap; }
  #hud span { color: #7dffb2; font-weight: 700; }
  #help { position: fixed; bottom: 10px; left: 16px; font-size: 13px; opacity: .6; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; background: rgba(5,8,16,.7); font-size: 20px; cursor: pointer; }
  #msg h1 { font-size: 48px; margin: 0 0 8px; color: #7dffb2; }
  #msg p { margin: 4px 0; opacity: .85; }
  .hidden { display: none !important; }
  #pad { position: fixed; bottom: 16px; right: 16px; display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; }
  #pad button { height: 56px; font-size: 22px; border-radius: 12px; border: 1px solid #345; background: rgba(30,50,80,.6); color: #fff; touch-action: manipulation; }
  @media (hover: hover) { #pad { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>Level <span id="lvl">1</span></div>
  <div>Time <span id="time">0.0</span>s</div>
  <div>Best <span id="best">-</span></div>
  <div>Mode <span id="mode">Normal</span></div>
</div>
<div id="help">Arrows / WASD move &middot; F fog of war &middot; H hint &middot; R new maze &middot; Space pause</div>
<div id="msg">
  <h1 id="title">MAZE</h1>
  <p id="sub">Reach the red exit. Arrows / WASD to move, or swipe.</p>
  <p>F: fog of war &middot; H: hint (costs +5s)</p>
  <p>Click or press Space to start</p>
</div>
<div id="pad">
  <span></span><button data-d="0,-1">▲</button><span></span>
  <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const msg = $('msg');

  let level = 1, cols, rows, grid, px, py, trail, hint = null;
  let fog = false, state = 'menu', t0 = 0, elapsed = 0, penalty = 0;
  let cell = 20, ox = 0, oy = 0, flash = 0;
  const bestKey = l => 'maze.best.' + l + (fog ? '.fog' : '');
  const getBest = l => { try { return +localStorage.getItem(bestKey(l)) || 0; } catch (e) { return 0; } };
  const setBest = (l, v) => { try { localStorage.setItem(bestKey(l), v); } catch (e) {} };

  // Each cell: bitmask of open passages. 1=N 2=E 4=S 8=W
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], BIT = [1, 2, 4, 8], OPP = [4, 8, 1, 2];

  function generate(w, h) {
    const g = new Uint8Array(w * h), seen = new Uint8Array(w * h);
    const stack = [[0, 0]]; seen[0] = 1;
    while (stack.length) {            // iterative recursive-backtracker
      const [x, y] = stack[stack.length - 1];
      const opts = [];
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx >= 0 && ny >= 0 && nx < w && ny < h && !seen[ny * w + nx]) opts.push(d);
      }
      if (!opts.length) { stack.pop(); continue; }
      const d = opts[Math.random() * opts.length | 0];
      const nx = x + DX[d], ny = y + DY[d];
      g[y * w + x] |= BIT[d]; g[ny * w + nx] |= OPP[d];
      seen[ny * w + nx] = 1; stack.push([nx, ny]);
    }
    // knock out a few walls on bigger levels so there are loops
    const extra = Math.floor(w * h * 0.03);
    for (let i = 0; i < extra; i++) {
      const x = Math.random() * w | 0, y = Math.random() * h | 0, d = Math.random() * 4 | 0;
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      g[y * w + x] |= BIT[d]; g[ny * w + nx] |= OPP[d];
    }
    return g;
  }

  function solve() {                  // BFS from player to exit
    const prev = new Int32Array(cols * rows).fill(-1), start = py * cols + px, goal = rows * cols - 1;
    const q = [start]; prev[start] = start;
    for (let i = 0; i < q.length; i++) {
      const c = q[i]; if (c === goal) break;
      const x = c % cols, y = c / cols | 0;
      for (let d = 0; d < 4; d++) {
        if (!(grid[c] & BIT[d])) continue;
        const n = (y + DY[d]) * cols + x + DX[d];
        if (prev[n] < 0) { prev[n] = c; q.push(n); }
      }
    }
    const path = []; for (let c = goal; c !== start; c = prev[c]) path.push(c);
    return path.reverse();
  }

  function newMaze() {
    cols = 8 + level * 2; rows = 6 + level * 2;
    cols = Math.min(cols, 60); rows = Math.min(rows, 40);
    grid = generate(cols, rows);
    px = 0; py = 0; trail = new Set([0]); hint = null;
    elapsed = 0; penalty = 0; t0 = performance.now();
    $('lvl').textContent = level;
    $('best').textContent = getBest(level) ? getBest(level).toFixed(1) + 's' : '-';
    $('mode').textContent = fog ? 'Fog' : 'Normal';
    layout();
  }

  function layout() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    if (!grid) return;
    const topPad = 50, botPad = 30;
    cell = Math.floor(Math.min((innerWidth - 24) / cols, (innerHeight - topPad - botPad) / rows));
    ox = Math.floor((innerWidth - cell * cols) / 2);
    oy = topPad + Math.floor((innerHeight - topPad - botPad - cell * rows) / 2);
  }

  function move(dx, dy) {
    if (state !== 'play') return;
    const d = DX.findIndex((v, i) => v === dx && DY[i] === dy);
    if (!(grid[py * cols + px] & BIT[d])) return;
    px += dx; py += dy; trail.add(py * cols + px);
    if (hint) { const i = hint.indexOf(py * cols + px); hint = i >= 0 ? hint.slice(i + 1) : null; }
    if (px === cols - 1 && py === rows - 1) win();
  }

  function win() {
    state = 'won';
    const t = elapsed;
    const prevBest = getBest(level);
    const record = !prevBest || t < prevBest;
    if (record) setBest(level, t.toFixed(1));
    $('title').textContent = 'LEVEL ' + level + ' CLEARED';
    $('sub').textContent = 'Time: ' + t.toFixed(1) + 's' + (record ? '  —  new best!' : '  (best ' + prevBest.toFixed(1) + 's)');
    msg.querySelector('p:last-child').textContent = 'Click or press Space for the next level';
    msg.classList.remove('hidden');
  }

  function start() {
    if (state === 'won') { level++; newMaze(); }
    else if (state === 'menu') newMaze();
    else if (state === 'paused') t0 = performance.now() - (elapsed - penalty) * 1000;  // resume
    state = 'play'; msg.classList.add('hidden');
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    $('title').textContent = 'PAUSED';
    $('sub').textContent = 'Take a breath.';
    msg.querySelector('p:last-child').textContent = 'Click or press Space to resume';
    msg.classList.remove('hidden');
  }

  function toggleFog() { fog = !fog; $('mode').textContent = fog ? 'Fog' : 'Normal'; $('best').textContent = getBest(level) ? getBest(level).toFixed(1) + 's' : '-'; }
  function useHint() { if (state !== 'play') return; hint = solve(); penalty += 5; }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); state === 'play' ? pause() : start(); return; }
    if (state === 'menu' || state === 'won') return;
    const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
    if (m) { e.preventDefault(); move(m[0], m[1]); }
    else if (k === 'f') toggleFog();
    else if (k === 'h') useHint();
    else if (k === 'r' && state === 'play') newMaze();
  });
  msg.addEventListener('click', start);
  document.querySelectorAll('#pad button').forEach(b => b.addEventListener('click', () => {
    const [x, y] = b.dataset.d.split(',').map(Number); move(x, y);
  }));
  let sx, sy;
  addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    Math.abs(dx) > Math.abs(dy) ? move(Math.sign(dx), 0) : move(0, Math.sign(dy));
  }, { passive: true });
  addEventListener('resize', layout);

  function draw() {
    const s = devicePixelRatio; ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!grid) return;
    const cx = c => ox + (c % cols) * cell, cy = c => oy + (c / cols | 0) * cell;
    const visible = c => {
      if (!fog) return true;
      const x = c % cols, y = c / cols | 0;
      return Math.hypot(x - px, y - py) <= 3.2;
    };

    // floor + trail
    ctx.fillStyle = '#111a2c'; ctx.fillRect(ox, oy, cols * cell, rows * cell);
    ctx.fillStyle = 'rgba(125,255,178,.12)';
    trail.forEach(c => { if (visible(c) || !fog) ctx.fillRect(cx(c) + 1, cy(c) + 1, cell - 2, cell - 2); });
    if (hint) {
      ctx.fillStyle = 'rgba(255,220,100,.35)';
      hint.forEach(c => { if (visible(c)) ctx.fillRect(cx(c) + cell * .3, cy(c) + cell * .3, cell * .4, cell * .4); });
    }

    // exit
    const ex = ox + (cols - 1) * cell, ey = oy + (rows - 1) * cell;
    ctx.fillStyle = '#ff4d5e'; ctx.shadowColor = '#ff4d5e'; ctx.shadowBlur = 14 + 6 * Math.sin(performance.now() / 250);
    ctx.fillRect(ex + cell * .2, ey + cell * .2, cell * .6, cell * .6); ctx.shadowBlur = 0;

    // walls
    ctx.strokeStyle = '#6fa8ff'; ctx.lineWidth = Math.max(2, cell / 9); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const c = y * cols + x;
      if (fog && !visible(c)) continue;
      const X = ox + x * cell, Y = oy + y * cell, g = grid[c];
      if (!(g & 1)) { ctx.moveTo(X, Y); ctx.lineTo(X + cell, Y); }
      if (!(g & 8)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + cell); }
      if (y === rows - 1 && !(g & 4)) { ctx.moveTo(X, Y + cell); ctx.lineTo(X + cell, Y + cell); }
      if (x === cols - 1 && !(g & 2)) { ctx.moveTo(X + cell, Y); ctx.lineTo(X + cell, Y + cell); }
      if (!(g & 2) && x < cols - 1) { ctx.moveTo(X + cell, Y); ctx.lineTo(X + cell, Y + cell); }
      if (!(g & 4) && y < rows - 1) { ctx.moveTo(X, Y + cell); ctx.lineTo(X + cell, Y + cell); }
    }
    ctx.stroke();

    // fog overlay
    if (fog) {
      const gx = ox + (px + .5) * cell, gy = oy + (py + .5) * cell, r = cell * 3.4;
      const grad = ctx.createRadialGradient(gx, gy, cell, gx, gy, r);
      grad.addColorStop(0, 'rgba(11,15,26,0)'); grad.addColorStop(1, 'rgba(11,15,26,1)');
      ctx.fillStyle = grad; ctx.fillRect(ox, oy, cols * cell, rows * cell);
    }

    // player
    ctx.fillStyle = '#7dffb2'; ctx.shadowColor = '#7dffb2'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(ox + (px + .5) * cell, oy + (py + .5) * cell, cell * .3, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }

  function loop() {
    if (state === 'play') {
      elapsed = (performance.now() - t0) / 1000 + penalty;
      $('time').textContent = elapsed.toFixed(1);
    }
    draw(); requestAnimationFrame(loop);
  }
  layout(); loop();
})();
</script>
</body>
</html>
