<!doctype html>
<html lang="en">
<head>

<title>Level 0</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: full-screen camcorder view; on-screen display (OSD) pinned to the four corners like a 90s camcorder; one tape-label card for menus. */
:root {
  --black: #070706;        /* page ground and letterbox */
  --osd: #f4f1e6;          /* camcorder OSD text */
  --rec: #e8302a;          /* record dot */
  --label: #e9e2c6;        /* tape label paper */
  --label-ink: #23211a;
  --mono: #c7b46a;         /* wallpaper yellow accent */
  --font-osd: "VT323", "Courier New", monospace;
  --font-type: "Space Mono", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--black); color: var(--osd); font: 14px/1.5 var(--font-type);
       -webkit-user-select: none; user-select: none; touch-action: none; cursor: default; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--black); }

.osd { position: fixed; font: 26px/1 var(--font-osd); letter-spacing: .04em; color: var(--osd); text-shadow: 0 0 2px rgba(255,255,255,.5), 2px 2px 0 rgba(0,0,0,.55); pointer-events: none; }
.tl { left: calc(28px + env(safe-area-inset-left, 0px)); top: calc(22px + env(safe-area-inset-top, 0px)); }
.tr { right: calc(28px + env(safe-area-inset-right, 0px)); top: calc(22px + env(safe-area-inset-top, 0px)); text-align: right; }
.bl { left: calc(28px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
.br { right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: right; }
#recdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--rec); margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 6px var(--rec); }
.batt { display: inline-block; width: 34px; height: 15px; border: 2px solid var(--osd); position: relative; vertical-align: -1px; margin-left: 6px; }
.batt::after { content: ""; position: absolute; right: -6px; top: 3px; width: 3px; height: 5px; background: var(--osd); }
.batt i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: calc(100% - 4px); background: var(--osd); }
#bars { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; margin-left: 8px; vertical-align: -2px; }
#bars span { width: 5px; background: rgba(244,241,230,.25); }
#bars span.on { background: var(--osd); }
#mapWrap { position: fixed; left: calc(28px + env(safe-area-inset-left, 0px)); top: calc(56px + env(safe-area-inset-top, 0px)); width: 150px;
           border: 2px solid rgba(244,241,230,.75); background: rgba(8,8,6,.55); box-shadow: 2px 2px 0 rgba(0,0,0,.5); transition: width .2s; }
#mapWrap.big { width: min(360px, calc(100vw - 56px)); }
#map { display: block; width: 100%; aspect-ratio: 1; cursor: pointer; }
#mapBar { display: flex; justify-content: space-between; align-items: center; padding: 1px 6px 0; font: 18px/1.1 var(--font-osd); color: var(--osd);
          background: rgba(244,241,230,.12); border-bottom: 1px solid rgba(244,241,230,.4); }
#mapBtn { font: 18px/1 var(--font-osd); color: var(--osd); background: none; border: 1px solid rgba(244,241,230,.6); padding: 0 6px; cursor: pointer; }
.settings { border-top: 1px dashed rgba(35,33,26,.45); padding-top: 10px; margin: 4px 0 16px; display: grid; gap: 6px; }
.settings h2 { font: 700 11px var(--font-type); letter-spacing: .2em; text-transform: uppercase; margin: 0; opacity: .75; }
.settings label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; }
.settings output { font: 20px/1 var(--font-osd); }
.settings input[type=range] { width: 100%; accent-color: var(--label-ink); height: 22px; margin: 0; }
#msg { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); font: 24px/1.2 var(--font-osd); text-align: center; width: min(90vw, 640px);
       text-shadow: 2px 2px 0 rgba(0,0,0,.7); pointer-events: none; transition: opacity .8s; }

#menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(5,5,4,.72); overflow: auto; }
.tape { width: min(470px, 100%); background: var(--label); color: var(--label-ink); padding: 18px 22px 20px; box-shadow: 0 18px 50px rgba(0,0,0,.7); position: relative; }
.tape::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: repeating-linear-gradient(90deg, var(--mono) 0 22px, #b49e52 22px 44px); }
.tape .hand { font: 700 12px var(--font-type); letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; opacity: .7; }
.tape h1 { font: 64px/0.9 var(--font-osd); margin: 6px 0 8px; letter-spacing: .02em; }
.tape p { margin: 0 0 12px; font-size: 13px; max-width: 46ch; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 12.5px; margin: 6px 0 16px; border-top: 1px dashed rgba(35,33,26,.45); padding-top: 10px; }
.keys b { white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 14px; font-variant-numeric: tabular-nums; }
.stats div { font: 30px/1 var(--font-osd); border-left: 2px solid var(--label-ink); padding-left: 8px; }
.stats small { display: block; font: 700 10px var(--font-type); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
button.go { font: 26px/1 var(--font-osd); letter-spacing: .06em; color: var(--label); background: var(--label-ink); border: 0; padding: 10px 20px 8px; cursor: pointer; }
button.go:hover { background: #3c382c; }
button:focus-visible { outline: 3px solid var(--mono); outline-offset: 2px; }
.touch-only { display: none; }

#touch { position: fixed; inset: 0; pointer-events: none; display: none; }
@media (pointer: coarse) {
  #touch { display: block; }
  .mouse-only { display: none; }
  .touch-only { display: contents; }
  .osd { font-size: 20px; }
  .bl, .br { bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
  #mapWrap { width: 112px; top: calc(48px + env(safe-area-inset-top, 0px)); }
}
#stick { position: absolute; left: 24px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%;
         border: 2px solid rgba(244,241,230,.3); pointer-events: auto; }
#nub { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(244,241,230,.45); }
#tRun { position: absolute; right: 26px; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; border-radius: 50%; pointer-events: auto;
        font: 20px var(--font-osd); color: var(--osd); background: rgba(10,10,8,.4); border: 2px solid rgba(244,241,230,.35); }
#tRun.on { background: rgba(244,241,230,.75); color: var(--black); }
</style>

<body>
<canvas id="gl"></canvas>
<div class="osd tl"><span id="recdot"></span>REC</div>
<div class="osd tr">SP <span class="batt"><i id="battFill"></i></span><br><span style="font-size:.8em">SIGNAL</span><span id="bars"><span style="height:5px"></span><span style="height:8px"></span><span style="height:11px"></span><span style="height:14px"></span><span style="height:18px"></span></span></div>
<div id="mapWrap"><div id="mapBar"><span>MAP</span><button id="mapBtn" type="button" aria-label="Expand map">+ M</button></div><canvas id="map" aria-label="Map of explored halls"></canvas></div>
<div class="osd bl" id="date"></div>
<div class="osd br" id="counter"></div>

<div id="menu"><div class="tape" id="card"></div></div>

<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const canvas = $('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false });
const card = $('card');
if (!gl) { card.innerHTML = '<h1>NO SIGNAL</h1><p>This browser cannot run WebGL, which Level 0 needs.</p>'; return; }
const aniso = gl.getExtension('EXT_texture_filter_anisotropic');

// ===================== noise & world rules =====================
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s, 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s, P) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const w = n => P ? ((n % P) + P) % P : n;
  const a = hash2(w(xi), w(yi), s), b = hash2(w(xi + 1), w(yi), s), c = hash2(w(xi), w(yi + 1), s), d = hash2(w(xi + 1), w(yi + 1), s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, o = 4, P = 0) { let t = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { t += vnoise(x * f, y * f, s + i * 17, P ? P * f : 0) * a; n += a; a *= .5; f *= 2; } return t / n; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

const CELL = 4, CEIL = 2.7, WIN = 64;
let EX = 9999, EZ = 9999; // exit cell
// edge types: 0 open, 1 full wall, 2 wall with doorway, 3 first half, 4 second half
const SOLIDS = [[], [[0, 4]], [[0, 1.4], [2.6, 4]], [[0, 2]], [[2, 4]]];
const OPENING = [2, -1, 2, 3, 1];
const edgeCache = new Map();
function edgeType(cx, cz, dir) {
  const key = cx * 131072 + cz * 2 + dir;
  let t = edgeCache.get(key);
  if (t !== undefined) return t;
  if (cx === EX && cz === EZ && dir === 0) t = 1;
  else if ((cx === 0 && cz === 0) || (dir === 0 && cx === 1 && cz === 0) || (dir === 1 && cx === 0 && cz === 1)) t = 0;
  else {
    const reg = fbm(cx / 9, cz / 9, 5, 3);
    const p = reg < .36 ? .1 : reg > .6 ? .56 : .32;
    if (hash2(cx * 2 + dir, cz, 101) > p) t = 0;
    else { const r = hash2(cx * 2 + dir, cz, 202); t = r < .38 ? 1 : r < .7 ? 2 : r < .85 ? 3 : 4; }
  }
  if (edgeCache.size > 200000) edgeCache.clear();
  edgeCache.set(key, t);
  return t;
}
function lightType(cx, cz) {
  if ((cx === 0 && cz === 0) || (cx === EX && cz === EZ)) return 1;
  const dark = fbm(cx / 6 + 50, cz / 6 + 50, 9, 3);
  if (hash2(cx, cz, 303) > (dark < .3 ? .3 : .93)) return 0;
  return hash2(cx, cz, 304) < .07 ? 2 : 1;
}
function hasPillar(cx, cz) {
  if (hash2(cx, cz, 505) > .09) return false;
  return !edgeType(cx, cz, 0) && !edgeType(cx, cz - 1, 0) && !edgeType(cx, cz, 1) && !edgeType(cx - 1, cz, 1);
}
const bottleAt = (cx, cz) => hash2(cx, cz, 606) < .055 && !(cx === 0 && cz === 0);
// passable between neighbouring cells?
function pass(ax, az, bx, bz) {
  if (bx === ax - 1) return edgeType(ax, az, 0) !== 1;
  if (bx === ax + 1) return edgeType(bx, bz, 0) !== 1;
  if (bz === az - 1) return edgeType(ax, az, 1) !== 1;
  return edgeType(bx, bz, 1) !== 1;
}
function bfs(sx, sz, R, tx, tz) {
  // returns map key->prev, dist; bounded box around (sx,sz)
  const prev = new Map(), dist = new Map(), q = [[sx, sz]], k = (x, z) => x * 100003 + z;
  dist.set(k(sx, sz), 0);
  for (let i = 0; i < q.length; i++) {
    const [x, z] = q[i], d = dist.get(k(x, z));
    if (x === tx && z === tz) break;
    for (const [nx, nz] of [[x + 1, z], [x - 1, z], [x, z + 1], [x, z - 1]]) {
      if (Math.abs(nx - sx) > R || Math.abs(nz - sz) > R || dist.has(k(nx, nz)) || !pass(x, z, nx, nz)) continue;
      dist.set(k(nx, nz), d + 1); prev.set(k(nx, nz), [x, z]); q.push([nx, nz]);
    }
  }
  return { prev, dist, k };
}

// ===================== procedural textures =====================
function makeTex(size, fn, mip = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const v = fn(x, y), i = (y * size + x) * 4;
    d[i] = v[0]; d[i + 1] = v[1]; d[i + 2] = v[2]; d[i + 3] = v[3] ?? 255;
  }
  g.putImageData(img, 0, 0);
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (mip) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 8); }
  else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  return t;
}
const c8 = v => clamp(Math.round(v), 0, 255);
function buildTextures() {
  const N = 512;
  // wallpaper: 1 m square. mono-yellow with faint vertical stripes and a small repeating diamond motif, paper grain
  const wall = makeTex(N, (x, y) => {
    const g = fbm(x / 3, y / 3, 11, 2, N / 3) * .5 + hash2(x, y, 12) * .5;
    const stripe = (Math.floor(x / 32) % 2) ? 1.035 : .975;
    const mx = (x % 64) - 32, my = (y % 64) - 32, md = Math.abs(mx) + Math.abs(my);
    const motif = md > 12 && md < 17 ? .86 : (md < 4 ? .9 : 1);
    const blot = fbm(x / 64, y / 64, 13, 3, 8);
    const k = stripe * motif * (.94 + g * .09) * (blot < .34 ? .97 : 1);
    const h = (motif < 1 ? 70 : 140) + g * 60 + (stripe > 1 ? 20 : 0);
    return [c8(216 * k), c8(192 * k), c8(100 * k), c8(h)];
  });
  // carpet: 0.75 m square. mustard-brown loop pile
  const carpet = makeTex(N, (x, y) => {
    const fib = hash2(x, y, 21), loops = vnoise(x / 2.2, y / 2.2, 22, N / 2.2), mid = fbm(x / 24, y / 24, 23, 3, N / 24);
    const k = .78 + fib * .18 + loops * .16 + (mid - .5) * .22;
    return [c8(150 * k), c8(130 * k), c8(80 * k), c8(80 + fib * 90 + loops * 70)];
  });
  // ceiling: 1.2 m square = 2x2 tiles of 0.6 m with seams and perforations
  const ceil = makeTex(N, (x, y) => {
    const tx = x % 256, ty = y % 256, seam = tx < 3 || ty < 3 || tx > 252 || ty > 252;
    const tile = Math.floor(x / 256) + Math.floor(y / 256) * 2;
    const perf = hash2(x >> 1, y >> 1, 31) < .06;
    const g = fbm(x / 6, y / 6, 32, 2, N / 6), stain = fbm(x / 90 + tile * 7, y / 90, 33, 3) > .74 ? .92 : 1;
    const k = seam ? .62 : (perf ? .8 : (.94 + g * .08)) * stain * (1 - tile * .012);
    return [c8(222 * k), c8(214 * k), c8(186 * k), c8(seam ? 20 : perf ? 110 : 170 + g * 40)];
  });
  // large-scale tileable noise for stains and damp patches
  const noise = makeTex(256, (x, y) => [c8(fbm(x / 32, y / 32, 41, 4, 8) * 255), c8(fbm(x / 16, y / 16, 42, 4, 16) * 255), c8(fbm(x / 8, y / 8, 43, 4, 32) * 255), 255]);
  return { wall, carpet, ceil, noise };
}

// ===================== shaders =====================
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src.slice(0, 200)); return s; }
function prog(vs, fs, attrs) {
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const FP = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision > 0 ? 'highp' : 'mediump';

const world = prog(`
attribute vec3 aPos; attribute vec3 aNor; attribute vec3 aCol; attribute float aMat;
uniform mat4 uVP; uniform mat4 uModel; uniform float uTime;
varying vec3 vPos; varying vec3 vNor; varying vec3 vCol; varying float vMat;
void main() {
  vec3 p = aPos;
  if (aMat > 3.5 && aMat < 4.5) p += vec3(sin(uTime * 37.0 + p.y * 23.0), 0.0, cos(uTime * 29.0 + p.y * 17.0)) * 0.018;
  vec4 w = uModel * vec4(p, 1.0);
  vPos = w.xyz; vNor = (uModel * vec4(aNor, 0.0)).xyz; vCol = aCol; vMat = aMat;
  gl_Position = uVP * w;
}`, `
precision ${FP} float;
uniform sampler2D uWall, uCarpet, uCeil, uNoise, uData;
uniform vec2 uOrigin; uniform float uTime; uniform vec3 uCam; uniform vec3 uEnt; uniform float uEntOn; uniform vec3 uExit;
varying vec3 vPos; varying vec3 vNor; varying vec3 vCol; varying float vMat;

float dec(float v) { return floor(v * 255.0 / 40.0 + 0.5); }
vec4 cellData(vec2 c) {
  vec2 uv = (c - uOrigin + 0.5) / ${WIN}.0;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return vec4(0.0);
  return texture2D(uData, uv);
}
float solidAt(float t, float x) {
  if (t < 0.5) return 0.0;
  if (t < 1.5) return 1.0;
  if (t < 2.5) return 1.0 - smoothstep(1.25, 1.55, x) * (1.0 - smoothstep(2.45, 2.75, x));
  if (t < 3.5) return 1.0 - smoothstep(1.85, 2.15, x);
  return smoothstep(1.85, 2.15, x);
}
// does a wall stand between a ceiling light (L) and this point (P)? soft-edged, 0 = blocked
float vis(vec2 L, vec2 P) {
  vec2 cl = floor(L / 4.0), cp = floor(P / 4.0);
  float v = 1.0;
  if (cl.x != cp.x) {
    float ex = max(cl.x, cp.x) * 4.0, t = (ex - L.x) / (P.x - L.x), z = L.y + (P.y - L.y) * t, cz = floor(z / 4.0);
    v *= 1.0 - solidAt(dec(cellData(vec2(max(cl.x, cp.x), cz)).r), z - cz * 4.0);
  }
  if (cl.y != cp.y) {
    float ez = max(cl.y, cp.y) * 4.0, t = (ez - L.y) / (P.y - L.y), x = L.x + (P.x - L.x) * t, cx = floor(x / 4.0);
    v *= 1.0 - solidAt(dec(cellData(vec2(cx, max(cl.y, cp.y))).g), x - cx * 4.0);
  }
  return v;
}
float rnd(float x) { return fract(sin(x * 12.9898) * 43758.5453); }
float level(vec4 d, vec2 cc) {
  float t = d.b * 255.0;
  if (t < 40.0) return 0.0;
  float r = d.a, I = 1.0;
  if (t > 120.0) { float k = rnd(floor(uTime * 13.0 + r * 91.0) + r * 7.0); I = k > 0.42 ? 1.0 : (k > 0.18 ? 0.3 : 0.02); }
  float de = distance(cc, uEnt.xz);
  if (uEntOn > 0.5 && de < 11.0) { float k = rnd(floor(uTime * 17.0 + r * 53.0) + 3.1); I *= mix(k > 0.55 ? 1.0 : 0.03, 1.0, smoothstep(3.0, 11.0, de)); }
  return I;
}
vec3 lin(vec3 c) { return c * c; }

void main() {
  vec3 p = vPos, n = normalize(vNor);
  if (vMat > 3.5 && vMat < 4.5) { gl_FragColor = vec4(vec3(0.008, 0.007, 0.006), 1.0); return; }
  if (vMat > 4.5) { gl_FragColor = vec4(vCol, 1.0); return; }
  vec3 alb, Tg, Bg; float h0, hx, hy, bumpK = 1.0, gloss = 0.0;
  vec2 cc0 = floor(p.xz / 4.0);
  if (vMat < 0.5) {                                   // carpet
    vec2 uv = p.xz / 0.75; float e = 1.0 / 512.0;
    vec4 c = texture2D(uCarpet, uv); alb = lin(c.rgb);
    h0 = c.a; hx = texture2D(uCarpet, uv + vec2(e, 0.0)).a; hy = texture2D(uCarpet, uv + vec2(0.0, e)).a;
    Tg = vec3(1.0, 0.0, 0.0); Bg = vec3(0.0, 0.0, 1.0); bumpK = 1.6;
    float st = texture2D(uNoise, p.xz / 11.0).r, st2 = texture2D(uNoise, p.xz / 3.3 + 0.37).g;
    alb *= mix(1.0, 0.55, smoothstep(0.6, 0.72, st) * (0.6 + st2 * 0.6));     // damp patches
    alb *= 0.9 + texture2D(uNoise, p.xz / 1.7).b * 0.2;

    <span class="mouse-only"><b>Shift</b></span><span class="mouse-only">Run (you tire quickly)</span>
    <span class="touch-only"><b>Left stick · drag</b></span><span class="touch-only">Walk · look</span>
    <span class="touch-only"><b>RUN</b></span><span class="touch-only">Toggle running</span>
    <span><b>M · tap map</b></span><span>Expand or shrink the map</span>
    <span class="mouse-only"><b>P · Esc</b></span><span class="mouse-only">Pause and settings</span>
    <span><b>SIGNAL</b></span><span>More bars means you are closer to the exit</span>
    <span><b>Battery</b></span><span>Your sanity. The dark drains it. Almond water restores it</span>
  </div>`;
}
function settingsHtml() {
  return `<div class="settings"><h2>Settings</h2>
    <label for="volStatic"><span>Static volume</span><output id="volStaticOut">${SETTINGS.static}</output></label>
    <input type="range" id="volStatic" min="0" max="100" step="1" value="${SETTINGS.static}">
    <label for="volMaster"><span>Master volume</span><output id="volMasterOut">${SETTINGS.master}</output></label>
    <input type="range" id="volMaster" min="0" max="100" step="1" value="${SETTINGS.master}">
  </div>`;
}
function wireSettings() {
  [['volStatic', 'static'], ['volMaster', 'master']].forEach(([id, key]) => {
    const el = $(id); if (!el) return;
    el.addEventListener('input', () => { audioOn(); SETTINGS[key] = +el.value; $(id + 'Out').textContent = el.value; applyVolumes(); saveSettings(); });
  });
}
function showMenu(kind) {
  menu.hidden = false;
  const s = G ? `<div class="stats"><div>${$('counter').textContent}<small>tape time</small></div><div>${Math.round(G.walked)} m<small>walked</small></div><div>${G.drank}<small>almond water</small></div></div>` : '';
  if (kind === 'start') card.innerHTML = `<div class="hand">Tape 03 · do not erase</div><h1>LEVEL 0</h1>
    <p>You were leaning on a wall and it wasn't there. Now there is only damp carpet, yellow wallpaper and the hum of the lights, for what feels like miles.</p>
    <p>Find the exit door. Stay in the light. When the lights near you start to flicker, something is coming. Run.</p>
    ${controlsHtml()}${settingsHtml()}<button class="go" id="go" type="button">▶ PLAY</button>`;
  else if (kind === 'pause') card.innerHTML = `<div class="hand">Paused</div><h1>❚❚ PAUSE</h1>${settingsHtml()}${controlsHtml()}<button class="go" id="go" type="button">▶ RESUME</button>`;
  else if (kind === 'win') card.innerHTML = `<div class="hand">Recovered footage</div><h1>EXIT</h1><p>The door gives. Cold air, real air. The tape ends here.</p>${s}<button class="go" id="go" type="button">▶ NEW TAPE</button>`;
  else card.innerHTML = `<div class="hand">Tape recovered · owner unknown</div><h1>${kind === 'caught' ? 'FOUND YOU' : 'SIGNAL LOST'}</h1>
    <p>${kind === 'caught' ? 'The camera keeps recording for another forty minutes. Nothing moves in frame.' : 'You sat down against the wallpaper and stopped counting the hallways.'}</p>${s}<button class="go" id="go" type="button">▶ NEW TAPE</button>`;
  wireSettings();
  $('go').addEventListener('click', () => { audioOn(); if (kind !== 'pause') { newGame(); G.fade = 0; } resume(); });
  $('go').focus({ preventScroll: true });
}
function resume() {
  menu.hidden = true; running = true;
  if (!coarse && canvas.requestPointerLock) { try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => { dragLook = true; }); } catch (e) { dragLook = true; } }
  else dragLook = true;
}
function pauseGame() { if (!running || G.state !== 'play') return; running = false; keys.clear(); showMenu('pause'); }
function end(kind) {
  if (G.state !== 'play') return;
  G.state = kind; G.endT = kind === 'win' ? 2 : 2.4;
  if (kind === 'caught') { G.fear = 1; G.scare = 0; G.flash = .9; G.endT = 2.1; G.vx = G.vz = 0; CR.scare = true; CR.tw = [0, 0]; sfxScream(); }
  if (kind === 'win') say('The door opens.', 2);
}

document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; if (locked) dragLook = false; else if (running && !dragLook) pauseGame(); });
document.addEventListener('pointerlockerror', () => { dragLook = true; });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!running) { if (k === 'enter') $('go')?.click(); return; }
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if ((k === 'escape' && dragLook) || k === 'p') { if (k === 'p' && document.pointerLockElement) document.exitPointerLock(); pauseGame(); }
  if (k === 'm') toggleMap();
  keys.add(k);
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());
const look = (dx, dy, k) => { G.yaw -= dx * k; G.pitch = clamp(G.pitch - dy * k, -1.3, 1.3); };
let mdown = false, mx = 0, my = 0;
document.addEventListener('mousemove', e => {
  if (!running) return;
  if (locked) look(e.movementX, e.movementY, .0021);
  else if (dragLook && mdown) { look(e.clientX - mx, e.clientY - my, .004); mx = e.clientX; my = e.clientY; }
});
canvas.addEventListener('mousedown', e => { audioOn(); if (dragLook && e.button === 0) { mdown = true; mx = e.clientX; my = e.clientY; } });
window.addEventListener('mouseup', () => { mdown = false; });
const stickEl = $('stick'), nub = $('nub'); let stickId = null, lookId = null, lx = 0, ly = 0;
function stickMove(t) {
  const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 12;
  let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; }
  nub.style.transform = `translate(${dx}px, ${dy}px)`; stick.x = dx / max; stick.y = dy / max;
}
stickEl.addEventListener('touchstart', e => { e.preventDefault(); audioOn(); const t = e.changedTouches[0]; stickId = t.identifier; stickMove(t); }, { passive: false });
stickEl.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === stickId) stickMove(t); }, { passive: false });
const se = e => { for (const t of e.changedTouches) if (t.identifier === stickId) { stickId = null; stick.x = stick.y = 0; nub.style.transform = ''; } };
stickEl.addEventListener('touchend', se); stickEl.addEventListener('touchcancel', se);
canvas.addEventListener('touchstart', e => { e.preventDefault(); audioOn(); if (lookId !== null) return; const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === lookId) { look(t.clientX - lx, t.clientY - ly, .005); lx = t.clientX; ly = t.clientY; } }, { passive: false });
const le = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
canvas.addEventListener('touchend', le); canvas.addEventListener('touchcancel', le);
$('tRun').addEventListener('pointerdown', e => { e.preventDefault(); tflags.run = !tflags.run; $('tRun').classList.toggle('on', tflags.run); });

// ===================== loop =====================
let last = performance.now(), osdT = 0, FRAME_DT = 1 / 60;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; FRAME_DT = dt;
  if (G) G.flash = Math.max(0, (G.flash || 0) - dt * 2.5);
  if (running && G) {
    G.t += dt;
    if (G.state === 'play') { updatePlayer(dt); updateEntity(dt); G.fade = Math.min(1, G.fade + dt * .6); }
    else if (G.state === 'caught') {
      // jumpscare: it lunges into the lens, jaw open, claws spread; then the tape cuts
      G.scare += dt; G.endT -= dt; CR.mouth = Math.min(1, CR.mouth + dt * 7);
      let dx = CR.x - G.x, dz = CR.z - G.z; const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
      const headOff = Math.hypot(CR.head[0] - CR.x, CR.head[2] - CR.z), want = 1.3 - .82 * clamp(G.scare / .22, 0, 1);
      CR.x = G.x + dx * (want + headOff); CR.z = G.z + dz * (want + headOff); CR.face = Math.atan2(dx, dz);
      G.ent.x = CR.x; G.ent.z = CR.z;
      crUpdate(dt, 0, 0, 0, () => {});
      G.yaw = Math.atan2(-dx, -dz); G.pitch = Math.atan2(CR.head[1] - 1.6, want);
      G.fade = G.endT < .12 ? 0 : 1;
      if (G.endT <= 0) { running = false; if (document.pointerLockElement) document.exitPointerLock(); showMenu(G.state); }
    }
    else { G.endT -= dt; G.fade = Math.max(0, G.fade - dt * (G.state === 'win' ? .8 : .45)); if (G.endT <= 0) { running = false; if (document.pointerLockElement) document.exitPointerLock(); showMenu(G.state); } }
    const dEnt = G.ent.on ? Math.hypot(G.ent.x - G.x, G.ent.z - G.z) : 99;
    const target = G.state === 'caught' ? 1 : Math.max(clamp(1 - dEnt / 14, 0, 1), (1 - G.sanity / 100) * .6);
    G.fear += (target - G.fear) * Math.min(1, dt * 3);
    if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('msg').style.opacity = 0; }
  }
  if (G) updateAudio(dt);
  if (G) {
    render(now);
    osdT -= dt; if (osdT <= 0) { osdT = .1; osd(); }
    drawMap();
  }
  requestAnimationFrame(frame);
}

// ===================== boot =====================
let TEX;
try { TEX = buildTextures(); resize(); newGame(); G.fade = .55; }
catch (err) { card.innerHTML = `<h1>NO SIGNAL</h1><p>${String(err.message).slice(0, 300)}</p>`; console.error(err); return; }
showMenu('start');
window.__level0 = { get G() { return G; }, exit: () => [EX, EZ], crReset, entN: () => entMesh.n };
requestAnimationFrame(frame);
})();
</script>
